<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>LjusCo Tycoon</title>
<!--
  LjusCo Tycoon – ett idle/tycoon-spel om LjusCo, dörrförsäljning av ljusklasar i Göteborg.
  En enda fil: HTML + CSS + vanilla JavaScript. Inga externa bilder eller bibliotek.
  Allt som är kul att mixtra med (säljare, priser, balans) ligger i CONFIG högst upp i <script>.
-->
<style>
/* =========================================================================
   FÄRGER OCH GRUND
   ========================================================================= */
:root {
  --plum: #2b1838;
  --plum2: #43264f;
  --cream: #fff7e8;
  --cream2: #fbebcd;
  --card: #fffdf7;
  --ink: #3b2716;
  --ink2: #7a6046;
  --orange: #ff8a3d;
  --orange2: #e86a1c;
  --gold: #ffc94a;
  --gold2: #f0a91c;
  --green: #4fb36a;
  --green2: #2f8f4c;
  --red: #e5534b;
  --blue: #4a8fd8;
  --teal: #2fa3a0;
  --shadow: 0 4px 0 rgba(59, 39, 22, .18), 0 8px 18px rgba(59, 39, 22, .14);
  --shadow-s: 0 2px 0 rgba(59, 39, 22, .2), 0 4px 10px rgba(59, 39, 22, .12);
  --panel-w: 480px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-width: 1280px;
  background: var(--plum);
  color: var(--ink);
  font-family: "Nunito", "Segoe UI Rounded", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  overflow: hidden;
  user-select: none;
}
button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 12px;
  padding: 7px 12px;
  background: var(--cream2);
  color: var(--ink);
  font-weight: 800;
  box-shadow: 0 3px 0 rgba(59,39,22,.25);
  transition: transform .08s, filter .15s, background .15s;
}
button:hover:not(:disabled) { filter: brightness(1.06); }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(59,39,22,.25); }
button:disabled { opacity: .5; cursor: default; filter: grayscale(.4); }
button.buy { background: #d9d0bf; color: #6d604f; }
button.buy.can { background: linear-gradient(#7fd48c, var(--green)); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
button.orange { background: linear-gradient(#ffab6b, var(--orange)); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
button.red { background: linear-gradient(#f07a73, var(--red)); color: #fff; }
button.ghost { background: transparent; box-shadow: none; text-decoration: underline; padding: 4px 6px; }
button.small { padding: 4px 9px; font-size: 12px; border-radius: 9px; }

/* =========================================================================
   TOPPBAR
   ========================================================================= */
#topbar {
  height: 64px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: linear-gradient(#4a2a57, var(--plum));
  color: #fff;
  border-bottom: 3px solid #1d0f27;
  position: relative;
  z-index: 20;
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; letter-spacing: .3px; white-space: nowrap; }
.logo b { color: var(--gold); }
.stat {
  background: rgba(255,255,255,.1);
  border-radius: 14px;
  padding: 5px 12px;
  display: flex; flex-direction: column;
  line-height: 1.15;
  min-width: 96px;
}
.stat small { font-size: 11px; opacity: .75; font-weight: 700; }
.stat span { font-size: 17px; font-weight: 900; white-space: nowrap; }
.stat.cash span { color: var(--gold); font-size: 21px; }
#effects { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; align-items: center; overflow: hidden; height: 56px; align-content: center; }
.chip {
  font-size: 11px; font-weight: 800;
  padding: 2px 8px; border-radius: 99px;
  background: #fff; color: var(--ink);
  white-space: nowrap;
  animation: pop .3s;
}
.chip.good { background: #d7f5d8; color: #1f6b33; }
.chip.bad { background: #ffd9d4; color: #9b2a22; }
.chip.ability { background: #ffe9b8; color: #7a4d00; }
#buyMode { display: flex; background: rgba(0,0,0,.25); border-radius: 12px; padding: 3px; }
#buyMode button { padding: 4px 9px; background: transparent; color: #fff; box-shadow: none; font-size: 12px; }
#buyMode button.on { background: var(--gold); color: var(--ink); }
#settingsBtn { background: rgba(255,255,255,.14); color: #fff; font-size: 18px; padding: 6px 10px; }

/* =========================================================================
   HUVUDLAYOUT
   ========================================================================= */
#main { display: flex; height: calc(100vh - 64px); overflow: hidden; }
#left { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#scene {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  background: #3b2147;
  scrollbar-width: thin;
}
#world { position: relative; width: 100%; min-width: 790px; }

/* Vägen längs vänsterkanten */
#road {
  position: absolute; left: 0; top: 150px; bottom: 0; width: 96px;
  background: #4d4a52;
  border-right: 5px solid #d9cfba;
  border-left: 5px solid #d9cfba;
  z-index: 3;
}
#road::after {
  content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px;
  background: repeating-linear-gradient(#f5e9b0 0 18px, transparent 18px 36px);
  opacity: .8;
}
#car { position: absolute; left: 24px; width: 48px; z-index: 6; will-change: top; }
#car svg { display: block; transition: transform .25s; }
#car .load {
  position: absolute; left: 50px; top: 50%; transform: translateY(-50%);
  background: #fff; border-radius: 10px; padding: 2px 7px; font-weight: 900; font-size: 12px;
  box-shadow: var(--shadow-s); white-space: nowrap; color: var(--green2);
}
#car.flat svg { animation: shake .25s infinite; }
#car .flatTag { position: absolute; left: 50px; top: -6px; background: var(--red); color: #fff; border-radius: 8px; padding: 1px 6px; font-size: 11px; font-weight: 900; display: none; }
#car.flat .flatTag { display: block; }

/* Hemma */
#home { position: relative; height: 270px; overflow: hidden; }
#home .homeBg { position: absolute; inset: 0; }
.homeCard {
  position: absolute; background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
  padding: 9px 11px; z-index: 4;
}
#kassaCard { left: 112px; top: 148px; width: 238px; }
#carCard { left: 112px; top: 14px; width: 238px; }
#benchCard { right: 14px; top: 150px; width: 300px; min-height: 104px; }
.homeCard h4 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.homeCard .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); font-weight: 700; }
.homeCard button.buy { width: 100%; margin-top: 6px; }
.homeCard .two { display: flex; gap: 6px; }
.homeCard .two button { flex: 1; font-size: 12px; padding: 6px 4px; }
#soranDesk { position: absolute; left: 370px; top: 140px; width: 140px; height: 124px; z-index: 3; }
#soranDesk .coin { position: absolute; font-weight: 900; color: var(--gold2); animation: coin .9s ease-out forwards; font-size: 13px; text-shadow: 0 1px 0 #fff; }
#bench { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.benchie { display: flex; flex-direction: column; align-items: center; width: 34px; font-size: 9px; font-weight: 800; color: var(--ink2); text-align: center; line-height: 1; }
.benchie svg { display: block; }

/* Områden */
.area { position: relative; height: 196px; overflow: hidden; border-top: 4px solid rgba(0,0,0,.18); }
.area .sky { position: absolute; inset: 0; }
.area .ground { position: absolute; left: 96px; right: 0; top: 164px; height: 32px; background: #d8ccb6; border-top: 3px solid #bfae92; }
.area .street { position: absolute; left: 286px; top: 22px; width: 520px; height: 168px; }
.area .street svg.bld { position: absolute; left: 0; top: 0; }
.areaInfo {
  position: absolute; left: 108px; top: 12px; width: 168px; bottom: 12px;
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
  padding: 8px 10px; z-index: 4; display: flex; flex-direction: column; gap: 3px;
}
.areaInfo h3 { margin: 0; font-size: 16px; line-height: 1.1; }
.areaInfo .meta { font-size: 11px; color: var(--ink2); font-weight: 800; }
.areaInfo .bagWrap { display: flex; align-items: center; gap: 6px; }
.areaInfo .bagText { font-size: 11px; font-weight: 800; line-height: 1.2; }
.areaInfo .bagText b { font-size: 13px; }
.areaInfo button { font-size: 12px; padding: 6px 4px; margin-top: auto; }
.bagSvg .fill { transition: height .2s, y .2s; }
.bagWrap.full .bagSvg { animation: pulse .8s infinite; }
.bagWrap.full .bagText { color: var(--red); }
.area.locked .street, .area.locked .sky { filter: grayscale(.85) brightness(.55); }
.lockBox {
  position: absolute; left: 330px; top: 50px; z-index: 5; text-align: center;
  background: var(--card); border-radius: 18px; padding: 14px 22px; box-shadow: var(--shadow);
}
.lockBox h3 { margin: 0 0 4px; }
.lockBox p { margin: 0 0 8px; color: var(--ink2); font-weight: 700; font-size: 12px; }
.fullNote { position: absolute; left: 300px; top: 8px; background: var(--red); color: #fff; padding: 2px 10px; border-radius: 10px; font-weight: 900; font-size: 12px; z-index: 5; display: none; animation: pulse .9s infinite; }
.area.isFull .fullNote { display: block; }
.stop { position: absolute; left: 76px; top: 86px; width: 26px; height: 26px; z-index: 4; }

/* Dörrar */
.door { position: absolute; width: 20px; height: 29px; z-index: 2; }
.door .inside { position: absolute; inset: 0; background: #ffcf6e; border-radius: 3px 3px 0 0; box-shadow: inset 0 0 8px #ff9f2e; }
.door .leaf {
  position: absolute; inset: 0; border-radius: 3px 3px 0 0; transform-origin: left center;
  transition: transform .25s ease-out; border: 2px solid rgba(0,0,0,.25);
}
.door .leaf::after { content: ""; position: absolute; right: 3px; top: 13px; width: 3px; height: 3px; border-radius: 50%; background: #f6d36b; }
.door.open .leaf { transform: perspective(70px) rotateY(-72deg); }
.door.knock .leaf { animation: knock .3s 2; }
.door .bub {
  position: absolute; bottom: 33px; left: 50%; transform: translateX(-50%);
  background: #fff; border-radius: 10px; padding: 2px 7px; font-size: 11px; font-weight: 900; white-space: nowrap;
  box-shadow: var(--shadow-s); animation: bub 1.1s ease-out forwards; pointer-events: none; z-index: 8;
}
.door .bub.no { color: #9b4a3a; }
.door .bub.yes { color: var(--green2); }
.door .bub.kn { color: #8a7a6a; background: #f4ecdf; }

/* Säljarfigurer */
.seller { position: absolute; top: 118px; width: 26px; height: 50px; z-index: 6; will-change: transform; }
.seller svg { display: block; }
.seller .fig { transition: transform .15s; }
.seller.left .fig { transform: scaleX(-1); }
.seller.walk .lg1 { animation: legA .32s infinite alternate; }
.seller.walk .lg2 { animation: legB .32s infinite alternate; }
.seller.walk .fig { animation: bob .32s infinite alternate; }
.seller .nm {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  font-size: 9px; font-weight: 900; color: #fff; background: rgba(43,24,56,.7); padding: 0 4px; border-radius: 6px; white-space: nowrap;
}
.seller.evicted { opacity: .4; }
.seller.idle .fig { animation: none; }

/* Flygande siffror */
.float {
  position: absolute; z-index: 9; pointer-events: none; font-weight: 900; font-size: 14px;
  color: #2f9e4c; text-shadow: 0 1px 0 #fff, 0 0 4px #fff; white-space: nowrap;
  animation: floatUp 1.3s ease-out forwards;
}
.float.big { font-size: 18px; color: var(--gold2); }

/* =========================================================================
   MANAGER-RAD
   ========================================================================= */
#managers {
  height: 104px; flex: none;
  background: linear-gradient(#5a3468, #3a1f47);
  border-top: 3px solid #1d0f27;
  display: flex; gap: 8px; padding: 9px 10px; align-items: stretch; overflow: hidden;
}
.mgr { background: var(--cream); border-radius: 16px; display: flex; gap: 6px; padding: 6px 6px; flex: none; box-shadow: var(--shadow-s); align-items: center; }
.mgr .who { display: flex; flex-direction: column; align-items: center; width: 56px; text-align: center; line-height: 1.1; }
.mgr .who b { font-size: 13px; }
.mgr .who small { font-size: 10px; color: var(--ink2); font-weight: 800; }
.mgr .portrait { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: #ffe2b0; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15); cursor: pointer; }
.ability {
  width: 98px; display: flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 6px 8px;
  background: linear-gradient(#ffd77e, var(--gold)); text-align: left; position: relative;
}
.ability .an { font-size: 11px; line-height: 1.1; letter-spacing: -.2px; }
.ability .as { font-size: 11px; font-weight: 800; color: #6d4a00; }
.ability .ab { height: 6px; border-radius: 4px; background: rgba(0,0,0,.15); overflow: hidden; }
.ability .ab i { display: block; height: 100%; background: #fff; width: 0; }
.ability.active { background: linear-gradient(#a8ef9f, var(--green)); color: #fff; }
.ability.active .as { color: #eaffea; }
.ability.cd { background: #e2d8c6; }
.mgr.maxi { flex: 1; min-width: 0; }
.mgr.maxi .mtext { font-size: 11.5px; font-weight: 800; flex: 1; min-width: 0; line-height: 1.25; }
.mgr.maxi .mtext span { color: var(--green2); }
.mgr.gone { opacity: .6; }

/* =========================================================================
   SIDOPANEL
   ========================================================================= */
#panel {
  width: var(--panel-w); flex: none; background: var(--cream);
  display: flex; flex-direction: column; min-height: 0; border-left: 4px solid #1d0f27;
}
#tabs { display: flex; gap: 3px; padding: 8px 8px 0; background: var(--plum2); }
#tabs button {
  flex: 1; border-radius: 12px 12px 0 0; padding: 9px 2px; font-size: 13px;
  background: #7a5a86; color: #f6e6ff; box-shadow: none;
}
#tabs button.on { background: var(--cream); color: var(--ink); }
#tabs button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-left: 3px; vertical-align: middle; }
#tabBody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }
.sec { background: var(--card); border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; box-shadow: var(--shadow-s); }
.sec h3 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.sec p { margin: 4px 0; color: var(--ink2); font-weight: 600; font-size: 13px; }
.sec .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.muted { color: var(--ink2); font-size: 12px; font-weight: 700; }
.stars { color: var(--gold2); letter-spacing: -1px; font-size: 13px; }
.stars i { color: #e3d7c3; font-style: normal; }
.stars.gold { color: #ffb800; text-shadow: 0 0 6px #ffd76a; }
.badge { display: inline-block; font-size: 11px; font-weight: 900; padding: 1px 7px; border-radius: 8px; background: #eee3cf; color: var(--ink); vertical-align: middle; }
.badge.A { background: var(--gold); }
.badge.B { background: #bfe1f5; }
.badge.trial { background: #ffd2e4; }
.badge.seat { background: #c9efcc; color: #1f6b33; }
.badge.bench { background: #e8e0d4; color: #7a6a5a; }
.badge.evict { background: #ffd9d4; color: #9b2a22; }
.maxiIcon { display: inline-flex; width: 18px; height: 18px; vertical-align: middle; }
.sellerCard { border-top: 1px dashed #e6d7bd; padding: 7px 0; }
.sellerCard:first-of-type { border-top: 0; }
.sellerCard .l1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sellerCard .l1 b { font-size: 14px; }
.sellerCard .l2 { font-size: 12px; color: var(--ink2); font-weight: 700; margin-top: 2px; }
.sellerCard .l3 { display: flex; gap: 5px; margin-top: 4px; }
.cands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cand { background: var(--cream2); border-radius: 12px; padding: 7px; text-align: center; display: flex; flex-direction: column; gap: 3px; }
.cand b { font-size: 14px; }
.cand .via { font-size: 10px; font-weight: 900; border-radius: 8px; padding: 1px 4px; background: #e0d2f0; color: #5a2a7a; }
.cand .via.maxi { background: #ffd28f; color: #7a3d00; }
.cand button { font-size: 12px; padding: 5px 4px; }
.ladder { display: flex; flex-direction: column; gap: 6px; }
.lrow { display: flex; align-items: center; gap: 9px; padding: 7px; border-radius: 12px; background: var(--cream2); }
.lrow.cur { background: #ffe7a8; outline: 3px solid var(--gold); }
.lrow.owned { opacity: .7; }
.lrow .ic { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 10px; }
.lrow .tx { flex: 1; line-height: 1.25; }
.lrow .tx b { font-size: 14px; }
.lrow .tx small { display: block; color: var(--ink2); font-weight: 700; font-size: 12px; }
table.rep { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rep td { padding: 4px 2px; border-bottom: 1px dashed #eadcc4; }
table.rep td:last-child, table.rep th:last-child { text-align: right; font-weight: 800; }
table.rep th { text-align: left; font-size: 12px; color: var(--ink2); }
table.rep tr.tot td { font-weight: 900; font-size: 14px; border-bottom: 0; color: var(--green2); }
table.rep tr.sub td { padding-left: 14px; color: var(--ink2); font-size: 12px; }
.upRow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed #eadcc4; }
.upRow:first-of-type { border-top: 0; }
.upRow .tx { flex: 1; font-weight: 700; font-size: 13px; line-height: 1.25; }
.upRow .tx small { display: block; color: var(--ink2); font-size: 11px; }
.upRow button { min-width: 120px; font-size: 12px; }
.bigPortrait { width: 92px; height: 92px; border-radius: 50%; overflow: hidden; background: #ffe2b0; border: 4px solid #fff; box-shadow: var(--shadow-s); flex: none; }
.prog { height: 8px; background: #eadfcb; border-radius: 5px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--green); }

/* =========================================================================
   MODALER, TOASTS, TOOLTIP
   ========================================================================= */
#modalLayer { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(30, 14, 40, .55); }
#modalLayer.on { display: flex; }
.modal {
  background: var(--cream); border-radius: 22px; padding: 18px 20px; width: 520px; max-height: 84vh; overflow-y: auto;
  box-shadow: 0 10px 0 rgba(0,0,0,.2), 0 20px 50px rgba(0,0,0,.4); animation: pop .25s;
}
.modal h2 { margin: 0 0 8px; font-size: 22px; }
.modal p { font-weight: 600; line-height: 1.45; }
.modal .mbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.modal textarea { width: 100%; height: 90px; font-family: monospace; font-size: 11px; border-radius: 10px; border: 2px solid #e2d3b6; padding: 6px; user-select: text; }
.speech { display: flex; gap: 14px; align-items: flex-start; }
.speech .bubble { background: #fff; border-radius: 18px; padding: 12px 14px; position: relative; font-weight: 700; line-height: 1.45; flex: 1; box-shadow: var(--shadow-s); }
.speech .bubble::before { content: ""; position: absolute; left: -10px; top: 26px; border: 10px solid transparent; border-right-color: #fff; border-left: 0; }
.rankList { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rankList ol { margin: 4px 0; padding-left: 22px; font-weight: 700; font-size: 13px; }
.rankList li span { color: var(--ink2); font-size: 11px; }
#toasts { position: fixed; right: calc(var(--panel-w) + 22px); bottom: 122px; z-index: 40; display: flex; flex-direction: column-reverse; gap: 8px; width: 330px; pointer-events: none; }
.toast {
  pointer-events: auto; background: var(--card); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow);
  border-left: 7px solid var(--gold); animation: slideIn .3s; font-weight: 700; font-size: 13px;
}
.toast b { display: block; font-size: 15px; margin-bottom: 2px; }
.toast.good { border-left-color: var(--green); }
.toast.bad { border-left-color: var(--red); }
.toast button { margin-top: 6px; font-size: 12px; }
.toast.out { animation: slideOut .35s forwards; }
#tooltip {
  position: fixed; z-index: 60; pointer-events: none; display: none; max-width: 300px;
  background: #2b1838; color: #fff; padding: 8px 10px; border-radius: 12px; font-size: 12px; font-weight: 700;
  white-space: pre-line; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.35);
}
#tooltip b { color: var(--gold); }

/* =========================================================================
   ANIMATIONER
   ========================================================================= */
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideOut { to { transform: translateX(40px); opacity: 0; } }
@keyframes floatUp { 0% { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -8px) scale(1.1); } 100% { transform: translate(-50%, -52px) scale(1); opacity: 0; } }
@keyframes bub { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -8px); } }
@keyframes knock { 0%,100% { transform: none; } 50% { transform: translateX(1.5px); } }
@keyframes legA { from { transform: translateY(0); } to { transform: translateY(-3px); } }

@keyframes coin { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }

.flick { animation: flicker 1.6s infinite; }
.counting { animation: count .35s infinite; transform-origin: 4px 2px; transform-box: fill-box; }

/* =========================================================================
   HJÄLPFUNKTIONER
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

// Färgverktyg för variationer av husfärger
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16); let r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
  return [h * 360, s * 100, l * 100];
}
function shade(hex, dl = 0, dh = 0, ds = 0) { const [h, s, l] = hexToHsl(hex); return `hsl(${(h + dh + 360) % 360},${clamp(s + ds, 0, 100)}%,${clamp(l + dl, 0, 100)}%)`; }

/* ---- Svensk talformatering: 1 234 kr, 12,3 tn, 3,4 mn, 5,6 md ---- */
const UNITS = [[1e21, 'trd'], [1e18, 'tr'], [1e15, 'bd'], [1e12, 'bn'], [1e9, 'md'], [1e6, 'mn'], [1e3, 'tn']];
// tn = tusen, mn = miljoner, md = miljarder, bn = biljoner, bd = biljarder, tr = triljoner
function group(n) { return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const neg = n < 0; n = Math.abs(n); let s;
  if (n < 1e4) s = group(n);
  else {
    const u = UNITS.find(u => n >= u[0]);
    if (!u) s = group(n);
    else { const v = n / u[0]; s = String(v >= 100 ? Math.floor(v) : (Math.floor(v * 10) / 10).toFixed(1).replace(/\.0$/, '')).replace('.', ',') + ' ' + u[1]; }
    if (n >= 1e24) s = n.toExponential(2).replace('.', ',');
  }
  return (neg ? '−' : '') + s;
}
const kr = n => fmt(n) + ' kr';
function krExact(n) { // med ören för små belopp (rapporter)
  if (Math.abs(n) < 1e4) return n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' kr';
  return kr(n);
}
const pctStr = (p, d = 0) => (p * 100).toFixed(d).replace('.', ',') + ' %';
function timeStr(sec) { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); }

/* ---- Stjärnor ---- */
function starCount(p) { const v = Math.round(p * 100); if (v >= 46) return 6; if (v >= 39) return 5; if (v >= 31) return 4; if (v >= 24) return 3; if (v >= 17) return 2; return 1; }
function starsHTML(p) { const c = starCount(p); if (c === 6) return '<span class="stars gold">★★★★★</span>'; return `<span class="stars">${'★'.repeat(c)}<i>${'★'.repeat(5 - c)}</i></span>`; }

/* =========================================================================
   SPELSTATE – allt som sparas ligger i S
   ========================================================================= */
let S = null;
let SIM = false;            // true när balans-simuleringen körs (ingen UI)

function makeSeller(name, pct, maxi) {
  return {
    id: S ? S.nextId++ : 0, name, pct, maxi: !!maxi,
    team: 'B', rank: 99, area: 0, pin: 0, seated: false,
    trialUntil: 0, recruitedBy: null, recruitUntil: 0, evictedUntil: 0,
    acc: Math.random(),
    week: { sold: 0, worked: 0, revenue: 0, bonus: 0 },
    total: { sold: 0, worked: 0, revenue: 0 },
  };
}

function newAreas() { return CONFIG.area.unlockCost.map((c, i) => ({ unlocked: i === 0, level: 1, bag: 0 })); }
function newAbilities() { const o = {}; for (const k in CONFIG.abilities) o[k] = { lvl: 0, until: -1, ready: 0 }; return o; }
function emptyReport() { return { gross: 0, commission: 0, maxiOwn: 0, maxiOther: 0, coach: 0, recruit: 0, profit: 0, rykteBonus: 0, clusters: 0 }; }

function newGame() {
  S = {
    v: 1, time: 0, cash: 0, cityIdx: 0, rykte: 0, cityEarned: 0, totalEarned: 0,
    areas: newAreas(), product: 0,

    kassa: { lvl: 1, buffer: 0 },
    sellers: [], nextId: 1,
    maxi: { active: true, pepLvl: 0 },
    coach: { hired: false, capLvl: 0, trainLvl: 0 },
    abilities: newAbilities(), goldArea: -1,
    effects: [], nextEventAt: rand(CONFIG.events.minGap, CONFIG.events.maxGap),
    week: { n: 1, t: 0 },
    report: { cur: emptyReport(), last: null, all: emptyReport() },
    candidates: [], nameUses: {},
    tutorialDone: false, buyMode: 1, tab: 'personal', completed: false, completedAt: 0,
    stats: { prestiges: 0, hired: 0, fired: 0, events: 0, unlocks: 0 },
    incomeRate: 0, incomeSamples: [], sampleAcc: 0, sampleSum: 0,
  };
  const [lo, hi] = CONFIG.startPctRange;
  for (const c of CONFIG.sellers) S.sellers.push(makeSeller(c.name, c.pct != null ? c.pct : rand(lo, hi), c.maxi));
  // Vecka 1: A-laget = de 6 bästa efter säljprocent
  [...S.sellers].sort((a, b) => b.pct - a.pct).forEach((s, i) => { s.team = i < CONFIG.week.aTeamSize ? 'A' : 'B'; s.rank = i; });
  newCandidates(false);
  seatsDirty = true;
}

const city = () => CONFIG.cities[S.cityIdx];
const areaName = i => city().areas[i];

/* =========================================================================
   HÄRLEDDA VÄRDEN (uppgraderingar, takt, kapacitet)
   ========================================================================= */
const milestonesHit = L => CONFIG.upgrades.milestones.filter(m => L >= m).length;
const nextMilestone = L => CONFIG.upgrades.milestones.find(m => L < m);
function levelCost(base, L) { return base * Math.pow(CONFIG.upgrades.growth, L - 1); }
function bulkCost(base, L, n) { const g = CONFIG.upgrades.growth; return levelCost(base, L) * (Math.pow(g, n) - 1) / (g - 1); }
function bulkInfo(base, L, mode = S.buyMode) {
  const room = CONFIG.upgrades.maxLevel - L; if (room <= 0) return { n: 0, cost: Infinity };
  let n;
  if (mode === 'max') { const g = CONFIG.upgrades.growth; n = Math.floor(Math.log(S.cash * (g - 1) / levelCost(base, L) + 1) / Math.log(g)); n = clamp(n || 0, 1, room); }
  else n = Math.min(mode, room);
  return { n, cost: bulkCost(base, L, n) };
}

const buyPower = i => Math.pow(CONFIG.area.buyPowerStep, i);
const product = () => CONFIG.products[S.product];
const productFactor = () => product().price / CONFIG.products[0].price;
function knockRateAt(L) { const c = CONFIG.area; return c.knockBase * (1 + c.knockPerLevel * (L - 1)) * Math.pow(2, milestonesHit(L)); }
const knockRate = i => knockRateAt(S.areas[i].level);
function bagCapAt(i, L) { const c = CONFIG.area; return c.bagBase * buyPower(i) * productFactor() * Math.pow(c.bagGrowth, L - 1); }
const bagCap = i => bagCapAt(i, S.areas[i].level);
const areaSeatsAt = L => CONFIG.area.seatsBase + CONFIG.area.seatsAt.filter(x => L >= x).length;
const areaSeats = i => areaSeatsAt(S.areas[i].level);

function carSpeedAt(L) { const c = CONFIG.car; return c.speedBase * (1 + c.speedPerLevel * (L - 1)) * Math.pow(2, milestonesHit(L)); }
function carCapAt(L) { const c = CONFIG.car; return c.capBase * Math.pow(c.capGrowth, L - 1) * Math.pow(2, milestonesHit(L)); }
function kassaRateAt(L) { const c = CONFIG.kassa; return c.rateBase * Math.pow(c.rateGrowth, L - 1) * Math.pow(2, milestonesHit(L)); }
const carSpeed = () => carSpeedAt(S.car.speedLvl) * (abilityActive('gas') ? CONFIG.gasBoost : 1);
const carCap = () => carCapAt(S.car.capLvl);
const kassaRate = () => kassaRateAt(S.kassa.lvl);
const carSeats = () => CONFIG.car.ladder[S.car.tier].seats;
const rykteMult = () => 1 + CONFIG.prestige.perRykte * S.rykte;
const maxiPep = () => S.maxi.active ? CONFIG.maxi.pepLevels[S.maxi.pepLvl] : 0;
const coachCap = () => CONFIG.coach.capBase + CONFIG.coach.capStep * S.coach.capLvl;
const coachTrain = () => CONFIG.coach.trainBase + CONFIG.coach.trainStep * S.coach.trainLvl;
const unlockedCount = () => S.areas.filter(a => a.unlocked).length;

/* ---- Effekter (events + förmågor) ---- */
const effect = (type, area) => S.effects.find(e => e.type === type && (area === undefined || e.area === area));
function abilityActive(k) { return S.abilities[k].until > S.time; }
function abilityDuration(k) { const c = CONFIG.abilities[k]; return c.duration + c.durStep * S.abilities[k].lvl; }
function abilityCooldown(k) { const c = CONFIG.abilities[k]; return c.cooldown * (1 - c.cdStep * S.abilities[k].lvl); }
const abilityReady = k => S.time >= S.abilities[k].ready;

function openChance(i) {
  let o = CONFIG.doors.baseOpen;
  if (effect('lonedag')) o *= 1.5;
  if (effect('regn')) o *= 0.7;
  if (abilityActive('gold') && S.goldArea === i) o *= CONFIG.goldBoost;
  return Math.min(o, CONFIG.doors.maxOpen);
}
function salePct(s, i) {
  let p = s.pct;
  if (S.maxi.active) p *= 1 + maxiPep();
  if (abilityActive('pep')) p *= CONFIG.pepptalkBoost;
  if (i !== undefined && effect('granne', i)) p *= 2;
  return Math.min(p, CONFIG.doors.maxSalePct);
}
function priceMult() { let m = 1; if (effect('jul')) m *= 2; if (effect('slut')) m *= 0.5; return m; }
const salePrice = i => product().price * buyPower(i) * priceMult();

/* =========================================================================
   EKONOMI – fördelningen räknas vid varje försäljning
   ========================================================================= */
function splitSale(price, seller) {
  const E = CONFIG.economy;
  const commission = price * (seller.team === 'A' ? E.commissionA : E.commissionB);
  const basis = (price - commission) * (1 - E.costBasis);        // 20 % kostnadsavdrag (bara beräkningsgrund)
  let maxiOwn = 0, maxiOther = 0;
  if (S.maxi.active) { if (seller.maxi) maxiOwn = basis * E.maxiOwn; else maxiOther = basis * E.maxiOther; }
  const coach = S.coach.hired ? price * E.coach : 0;
  let recruit = 0, recruiter = null;
  if (seller.recruitedBy != null && seller.recruitUntil > S.time) {
    recruiter = S.sellers.find(x => x.id === seller.recruitedBy);
    if (recruiter) recruit = price * E.recruitBonus;
  }
  const profit = price - commission - maxiOwn - maxiOther - coach - recruit;
  return { commission, maxiOwn, maxiOther, coach, recruit, recruiter, profit };
}

function processSale(s, i, qty, ignoreCap) {
  const price = salePrice(i) * qty;
  const sp = splitSale(price, s);
  const gain = sp.profit;
  S.areas[i].bag += gain;
  for (const r of [S.report.cur, S.report.all]) {
    r.gross += price; r.commission += sp.commission; r.maxiOwn += sp.maxiOwn; r.maxiOther += sp.maxiOther;
    r.coach += sp.coach; r.recruit += sp.recruit; r.profit += sp.profit; r.clusters += qty;
  }
  if (sp.recruiter) sp.recruiter.week.bonus += sp.recruit;
  s.week.sold += qty; s.week.revenue += price; s.total.sold += qty; s.total.revenue += price;
  if (!SIM) VIS.onSale(s, i, gain);
  return gain;
}

/* =========================================================================
   BILPLATSER – vilka säljare som åker med
   ========================================================================= */
let seatsDirty = true, seatTimer = 0;

function sellerOrder() {
  return [...S.sellers].sort((a, b) => (b.pin === 1) - (a.pin === 1) || (a.team === 'A' ? 0 : 1) - (b.team === 'A' ? 0 : 1) || a.rank - b.rank || b.pct - a.pct);
}
function bestAreaWithRoom(counts) {
  for (let i = S.areas.length - 1; i >= 0; i--) if (S.areas[i].unlocked && counts[i] < areaSeats(i)) return i;
  return -1;
}
function assignSeats() {
  seatsDirty = false;
  const seats = carSeats(); let used = 0;
  const counts = S.areas.map(() => 0);
  for (const s of S.sellers) s.seated = false;
  for (const s of sellerOrder()) {
    if (used >= seats) break;
    if (s.pin === -1) continue;
    if (!S.areas[s.area] || !S.areas[s.area].unlocked) s.area = 0;
    if (counts[s.area] >= areaSeats(s.area)) { const alt = bestAreaWithRoom(counts); if (alt < 0) continue; s.area = alt; }
    s.seated = true; counts[s.area]++; used++;
  }
}
// Sätter de bästa säljarna i områdena med högst köpkraft
function autoDistribute() {
  assignSeats();
  const seated = S.sellers.filter(s => s.seated).sort((a, b) => b.pct - a.pct);
  const counts = S.areas.map(() => 0);
  for (const s of seated) { const i = bestAreaWithRoom(counts); if (i >= 0) { s.area = i; counts[i]++; } }
  seatsDirty = true;
}
function areaWorkers(i) { return S.sellers.filter(s => s.seated && s.area === i); }

/* =========================================================================
   SPELLOGIK – en tick
   ========================================================================= */
function update(dt) {
  S.time += dt;

  // Veckotimer
  S.week.t += dt;
  if (S.week.t >= CONFIG.week.length) { S.week.t -= CONFIG.week.length; weekEnd(); }

  // Effekter som gått ut
  if (S.effects.length) {
    const before = S.effects.length;
    S.effects = S.effects.filter(e => e.until > S.time);
    if (S.effects.length !== before) seatsDirty = true;
  }

  // Slumphändelser
  if (S.time >= S.nextEventAt) { triggerRandomEvent(); S.nextEventAt = S.time + rand(CONFIG.events.minGap, CONFIG.events.maxGap); }

  seatTimer += dt;
  if (seatsDirty || seatTimer > 1) { seatTimer = 0; assignSeats(); }

  checkCompletion();
  updateSellers(dt);
  updateCar(dt);
  updateKassa(dt);
  sampleIncome(dt);
}

function updateSellers(dt) {
  const n = S.areas.length;
  const rate = [], open = [], full = [];
  for (let i = 0; i < n; i++) {
    const a = S.areas[i]; if (!a.unlocked) continue;
    rate[i] = knockRate(i); open[i] = openChance(i); full[i] = a.bag >= bagCap(i);
  }
  for (const s of S.sellers) {
    if (!s.seated) continue;
    if (s.evictedUntil > S.time) continue;
    const i = s.area;
    if (full[i]) { if (!SIM) VIS.outcome(s, 'full'); continue; }
    s.week.worked += dt; s.total.worked += dt;
    s.acc += rate[i] * dt;
    const k = Math.floor(s.acc); if (k <= 0) continue;
    s.acc -= k;
    const p = salePct(s, i), o = open[i];
    let opened = 0, sales = 0;
    if (k <= 80) { for (let j = 0; j < k; j++) if (Math.random() < o) { opened++; if (Math.random() < p) sales++; } }
    else { const q = o * p, mean = k * q; sales = Math.max(0, Math.round(mean + gauss() * Math.sqrt(mean * (1 - q)))); opened = Math.round(k * o); }
    if (sales > 0) { processSale(s, i, sales, false); if (S.areas[i].bag >= bagCap(i)) full[i] = true; }
    if (!SIM) VIS.outcome(s, sales > 0 ? 'sale' : opened > 0 ? 'no' : 'closed');
  }
}

/* ---- Bilen: åker till områdena i tur och ordning och hämtar pengar ---- */
function nextAreaWithMoney(after) {
  for (let i = after + 1; i < S.areas.length; i++) if (S.areas[i].unlocked && S.areas[i].bag > 0.5) return i;
  return -1;
}
function updateCar(dt) {
  const c = S.car;
  if (effect('punka')) return;
  let guard = 0;
  while (dt > 1e-6 && guard++ < 40) {
    if (c.phase === 'idle') {
      const nx = nextAreaWithMoney(-1);
      if (nx < 0) return;
      c.target = nx + 1; c.phase = 'move';
    } else if (c.phase === 'move') {
      const sp = carSpeed(), dist = Math.abs(c.target - c.pos), step = sp * dt;
      if (step >= dist) {
        dt -= dist / sp; c.pos = c.target;
        c.timer = CONFIG.car.stopTime;
        c.phase = c.target === 0 ? 'unload' : 'load';
      } else { c.pos += Math.sign(c.target - c.pos) * step; dt = 0; }
    } else if (c.phase === 'load' || c.phase === 'unload') {
      const t = Math.min(dt, c.timer); c.timer -= t; dt -= t;
      if (c.timer > 1e-6) continue;
      if (c.phase === 'load') {
        const i = Math.round(c.pos) - 1, a = S.areas[i];
        const take = Math.min(a.bag, carCap() - c.load);
        a.bag -= take; c.load += take;
        const nx = c.load < carCap() - 0.5 ? nextAreaWithMoney(i) : -1;
        c.target = nx >= 0 ? nx + 1 : 0; c.phase = 'move';
      } else {
        S.kassa.buffer += c.load;
        if (!SIM && c.load > 0) VIS.unload(c.load);
        c.load = 0; c.phase = 'idle';
      }
    }
  }
}

function updateKassa(dt) {
  const k = S.kassa; if (k.buffer <= 0) return;
  const amt = Math.min(k.buffer, kassaRate() * dt);
  k.buffer -= amt;
  // Rykte = permanent inkomstmultiplikator, läggs på när Soran räknar in pengarna
  const bonus = amt * (rykteMult() - 1);
  S.report.cur.rykteBonus += bonus; S.report.all.rykteBonus += bonus;
  addCash(amt + bonus);
}
function addCash(a) { S.cash += a; S.cityEarned += a; S.totalEarned += a; S.sampleAcc += a; }

function sampleIncome(dt) {
  S.sampleSum += dt;
  if (S.sampleSum >= 1) {
    S.incomeSamples.push(S.sampleAcc / S.sampleSum); S.sampleAcc = 0; S.sampleSum = 0;
    if (S.incomeSamples.length > 15) S.incomeSamples.shift();
    S.incomeRate = S.incomeSamples.reduce((a, b) => a + b, 0) / S.incomeSamples.length;
  }
}

/* =========================================================================
   VECKOSLUT: ranking, coachträning, nya kandidater
   ========================================================================= */
const perMin = s => s.week.worked > 0 ? s.week.sold / (s.week.worked / 60) : 0;

function weekEnd() {
  const W = CONFIG.week;
  // 1) Coachen tränar hela B-laget (även de på bänken)
  const trained = [];
  if (S.coach.hired) {
    for (const s of S.sellers) if (s.team === 'B' && s.pct < coachCap()) {
      const before = s.pct; s.pct = Math.min(coachCap(), s.pct + coachTrain()); trained.push({ name: s.name, gain: s.pct - before });
    }
  }
  // 2) Ranking efter klasar per arbetad minut
  const trial = S.sellers.filter(s => s.trialUntil > S.time);
  const rest = S.sellers.filter(s => !(s.trialUntil > S.time));
  const idle = rest.filter(s => s.week.worked < 5);          // har inte jobbat → behåller placering
  const workers = rest.filter(s => s.week.worked >= 5).sort((a, b) => perMin(b) - perMin(a) || b.pct - a.pct);
  const slots = Math.max(0, W.aTeamSize - idle.filter(s => s.team === 'A').length);
  const ranking = workers.map(s => ({ s, rate: perMin(s), sold: s.week.sold }));
  workers.forEach((s, i) => { s.team = i < slots ? 'A' : 'B'; });
  for (const s of trial) s.team = 'A';
  // Ny rangordning (för bilplatser): A-lag först efter prestation, sedan B
  const order = [...S.sellers].sort((a, b) => (a.team === 'A' ? 0 : 1) - (b.team === 'A' ? 0 : 1) || (b.week.worked >= 5 ? perMin(b) : -1) - (a.week.worked >= 5 ? perMin(a) : -1) || a.rank - b.rank);
  order.forEach((s, i) => s.rank = i);

  // 3) Rapport och veckostatistik
  S.report.last = { ...S.report.cur, week: S.week.n };
  S.report.cur = emptyReport();
  const info = { week: S.week.n, ranking, idle: idle.map(s => s.name), trial: trial.map(s => s.name), trained };
  for (const s of S.sellers) s.week = { sold: 0, worked: 0, revenue: 0, bonus: 0 };
  S.week.n++;
  newCandidates(false);
  seatsDirty = true;
  if (!SIM) UI.rankingPopup(info);
}

/* =========================================================================
   REKRYTERING, SPARKA, FLYTTA
   ========================================================================= */
function nextName() {
  const pool = CONFIG.candidateNames;
  const minUse = Math.min(...pool.map(n => S.nameUses[n] || 0));
  const name = pick(pool.filter(n => (S.nameUses[n] || 0) === minUse));
  S.nameUses[name] = (S.nameUses[name] || 0) + 1;
  return S.nameUses[name] > 1 ? `${name} ${S.nameUses[name]}` : name;
}
function hireCostFor(p) {
  const h = CONFIG.hireCost;
  return Math.round((h.base + S.incomeRate * h.incomeSeconds) * Math.pow(p / 0.25, h.exponent) / 10) * 10;
}
function makeCandidate(range, via) {
  const p = rand(range[0], range[1]);
  return { name: nextName(), pct: p, cost: hireCostFor(p), via };
}
function newCandidates(soranRound) {
  const range = soranRound ? CONFIG.recruitRoundPct : CONFIG.candidatePctRange;
  const list = [];
  const maxiSlot = !soranRound && S.maxi.active ? Math.floor(Math.random() * CONFIG.candidatesPerWeek) : -1;
  for (let k = 0; k < CONFIG.candidatesPerWeek; k++) {
    let via = null;
    if (k === maxiSlot) via = { type: 'maxi' };
    else if (Math.random() < CONFIG.viaSellerChance && S.sellers.length) { const r = pick(S.sellers); via = { type: 'seller', id: r.id, name: r.name }; }
    list.push(makeCandidate(range, via));
  }
  S.candidates = list;
}
function hire(idx) {
  const c = S.candidates[idx]; if (!c || S.cash < c.cost) return false;
  S.cash -= c.cost;
  const s = makeSeller(c.name, c.pct, c.via && c.via.type === 'maxi' && S.maxi.active);
  s.team = 'A'; s.trialUntil = S.time + CONFIG.week.length; s.rank = -1;   // provvecka i A-laget
  if (c.via && c.via.type === 'seller' && S.sellers.some(x => x.id === c.via.id)) { s.recruitedBy = c.via.id; s.recruitUntil = S.time + CONFIG.week.length; }
  S.sellers.push(s);
  S.candidates.splice(idx, 1);
  S.stats.hired++;
  seatsDirty = true;
  if (!SIM) UI.toast(`${esc(s.name)} är anställd!`, `Provvecka i A-laget. ${s.maxi ? 'En av Maxis säljare.' : ''}`, 'good');
  return true;
}
function fire(id) {
  if (S.sellers.length <= 1) return;
  const i = S.sellers.findIndex(s => s.id === id); if (i < 0) return;
  S.sellers.splice(i, 1);
  S.stats.fired++;
  seatsDirty = true;
}
function moveSeller(id, area) {
  const s = S.sellers.find(x => x.id === id); if (!s || !S.areas[area].unlocked) return false;
  if (s.seated && s.area !== area && areaWorkers(area).length >= areaSeats(area)) return false;
  s.area = area; seatsDirty = true; return true;
}

/* =========================================================================
   KÖP OCH UPPGRADERINGAR
   ========================================================================= */
function spend(c) { if (S.cash + 1e-9 < c) return false; S.cash -= c; return true; }
function upgradeArea(i) {
  const a = S.areas[i]; const b = bulkInfo(CONFIG.area.upgradeBase[i], a.level);
  if (b.n > 0 && spend(b.cost)) { a.level += b.n; seatsDirty = true; return true; } return false;
}
function upgradeCar(kind) {
  const c = S.car; const key = kind === 'speed' ? 'speedLvl' : 'capLvl';
  const b = bulkInfo(kind === 'speed' ? CONFIG.car.speedCostBase : CONFIG.car.capCostBase, c[key]);
  if (b.n > 0 && spend(b.cost)) { c[key] += b.n; return true; } return false;
}
function upgradeKassa() {
  const b = bulkInfo(CONFIG.kassa.costBase, S.kassa.lvl);
  if (b.n > 0 && spend(b.cost)) { S.kassa.lvl += b.n; return true; } return false;
}
function unlockArea(i) {
  const a = S.areas[i]; if (a.unlocked || (i > 0 && !S.areas[i - 1].unlocked)) return false;
  if (!spend(CONFIG.area.unlockCost[i])) return false;
  a.unlocked = true; S.stats.unlocks++;
  autoDistribute();
  if (!SIM) { UI.buildScene(); UI.toast(`${esc(areaName(i))} upplåst!`, 'Säljarna har fördelats om automatiskt. Ändra i Personal-fliken.', 'good'); }
  return true;
}
function buyProduct() {
  const n = S.product + 1; if (n >= CONFIG.products.length) return false;
  if (!spend(CONFIG.products[n].cost)) return false;
  S.product = n;
  if (!SIM) UI.toast('Ny produkt!', `Alla säljare säljer nu ${esc(CONFIG.products[n].name)}.`, 'good');
  return true;
}
function buyCarTier() {
  const n = S.car.tier + 1; if (n >= CONFIG.car.ladder.length) return false;
  if (!spend(CONFIG.car.ladder[n].cost)) return false;
  S.car.tier = n; seatsDirty = true;
  if (!SIM) { UI.toast(`Ny bil: ${CONFIG.car.ladder[n].name}!`, `${CONFIG.car.ladder[n].seats} platser för säljare.`, 'good'); VIS.rebuildCar(); }
  return true;
}
function hireCoach() { if (S.coach.hired || !S.areas[1].unlocked) return false; if (!spend(CONFIG.coach.hireCost)) return false; S.coach.hired = true; return true; }
const coachCapCost = () => CONFIG.coach.capCostBase * Math.pow(CONFIG.coach.capCostMult, S.coach.capLvl);
const coachTrainCost = () => CONFIG.coach.trainCostBase * Math.pow(CONFIG.coach.trainCostMult, S.coach.trainLvl);
function upgradeCoach(kind) {
  const C = CONFIG.coach;
  if (!S.coach.hired) return false;
  if (kind === 'cap') { if (S.coach.capLvl >= C.capMaxLevel || !spend(coachCapCost())) return false; S.coach.capLvl++; }
  else { if (S.coach.trainLvl >= C.trainMaxLevel || !spend(coachTrainCost())) return false; S.coach.trainLvl++; }
  return true;
}
const maxiPepCost = () => CONFIG.maxi.pepCosts[S.maxi.pepLvl];
function upgradeMaxi() { if (!S.maxi.active || S.maxi.pepLvl >= CONFIG.maxi.pepLevels.length - 1) return false; if (!spend(maxiPepCost())) return false; S.maxi.pepLvl++; return true; }
function endMaxi() { S.maxi.active = false; for (const s of S.sellers) s.maxi = false; for (const c of S.candidates) if (c.via && c.via.type === 'maxi') c.via = null; }
const abilityUpCost = k => CONFIG.abilities[k].costBase * Math.pow(CONFIG.abilities[k].costMult, S.abilities[k].lvl);
function upgradeAbility(k) { const a = S.abilities[k]; if (a.lvl >= CONFIG.abilities[k].maxLevel || !spend(abilityUpCost(k))) return false; a.lvl++; return true; }

/* =========================================================================
   FÖRMÅGOR (Soran & Arvin)
   ========================================================================= */
function useAbility(k, arg) {
  if (!abilityReady(k)) return false;
  const a = S.abilities[k];
  if (k === 'gold') { if (arg === undefined || !S.areas[arg] || !S.areas[arg].unlocked) return false; S.goldArea = arg; }
  if (k === 'recruit') newCandidates(true);
  a.until = S.time + abilityDuration(k);
  a.ready = S.time + abilityCooldown(k);
  if (!SIM) {
    if (k === 'pep') UI.toast('Soran: Pepptalk!', '"Nu kör vi! Varje dörr är en ny chans!" Alla säljare +25 % säljprocent.', 'good');
    if (k === 'recruit') { UI.toast('Soran: Värvningsrunda!', '3 nya, vassa kandidater väntar i Personal-fliken.', 'good'); UI.setTab('personal'); }
    if (k === 'gas') UI.toast('Arvin: Gasa på!', 'Bilen åker 3× snabbare.', 'good');
    if (k === 'gold') UI.toast('Arvin hittar guldgatan!', `Dubbelt så många dörrar öppnas i ${esc(areaName(arg))}.`, 'good');
  }
  return true;
}

   SLUMPHÄNDELSER

const EVENTS = [

  { id: 'punka', good: false, w: 2, title: 'Punka!', text: 'Arvin har fått punka. Bilen står still i 30 s, om du inte betalar för att laga direkt.', run() { addEffect('punka', 30); } },

      const pool = S.sellers.filter(s => s.seated && s.evictedUntil <= S.time);
      if (!pool.length) { ev.text = 'En fastighetsvärd skäller, men ingen säljare är ute. Puh!'; return; }
      const s = pick(pool); s.evictedUntil = S.time + 60; addEffect('evict', 60, { name: s.name });
      ev.text = `${esc(s.name)} blev utkastad från ${esc(areaName(s.area))} och säljer inget i 60 s.`; } },
  { id: 'slut', good: false, w: 2, title: 'Leverantören har slut', text: 'Leveransen är sen. Produkten ger −50 % i 60 s.', run() { addEffect('slut', 60); } },
];
function addEffect(type, dur, extra = {}) {
  const ex = S.effects.find(e => e.type === type && e.area === extra.area && type !== 'evict');
  if (ex) ex.until = Math.max(ex.until, S.time + dur);
  else S.effects.push({ type, until: S.time + dur, ...extra });
  seatsDirty = true;
}
function triggerRandomEvent(forceId) {
  let ev;
  if (forceId) ev = EVENTS.find(e => e.id === forceId);
  else { const tot = EVENTS.reduce((a, e) => a + e.w, 0); let r = Math.random() * tot; ev = EVENTS.find(e => (r -= e.w) < 0) || EVENTS[0]; }
  const inst = { ...ev };
  ev.run.call(inst, inst);
  S.stats.events++;
  if (!SIM) UI.eventToast(inst);
}
const flatFixCost = () => Math.max(200, Math.round(S.incomeRate * 20));
function fixFlat() { const e = effect('punka'); if (!e || !spend(flatFixCost())) return false; S.effects = S.effects.filter(x => x !== e); return true; }

/* =========================================================================
   MÅLET: spelet är klart när allt är upplåst i sista staden
   ========================================================================= */
const isLastCity = () => S.cityIdx === CONFIG.cities.length - 1;
function goalParts() {
  return [
    ['Nå sista staden (' + CONFIG.cities[CONFIG.cities.length - 1].name + ')', isLastCity()],
    ['Lås upp alla 8 områden där', isLastCity() && S.areas.every(a => a.unlocked)],
    ['Lås upp ' + CONFIG.products[CONFIG.products.length - 1].name, isLastCity() && S.product === CONFIG.products.length - 1],
    ['Köp ' + CONFIG.car.ladder[CONFIG.car.ladder.length - 1].name, isLastCity() && S.car.tier === CONFIG.car.ladder.length - 1],
  ];
}
function checkCompletion() {
  if (S.completed || !goalParts().every(p => p[1])) return;
  S.completed = true; S.completedAt = S.time;
  if (!SIM) { UI.completePopup(); save(); }
}
const playTimeStr = t => `${Math.floor(t / 3600)} h ${Math.floor(t % 3600 / 60)} min`;

/* =========================================================================
   PRESTIGE: NY STAD
   ========================================================================= */
const prestigeGain = () => Math.floor(CONFIG.prestige.k * Math.sqrt(S.cityEarned / CONFIG.prestige.unit));
const canPrestige = () => S.cityEarned >= CONFIG.prestige.minEarned && prestigeGain() > 0;
const nextCityIdx = () => Math.min(S.cityIdx + 1, CONFIG.cities.length - 1);
function doPrestige() {
  if (!canPrestige()) return false;
  const gain = prestigeGain();
  S.rykte += gain; S.stats.prestiges++;
  S.cityIdx = nextCityIdx();
  S.cash = 0; S.cityEarned = 0;
  S.areas = newAreas(); S.product = 0;
  S.car = { tier: 0, speedLvl: 1, capLvl: 1, pos: 0, target: 0, phase: 'idle', timer: 0, load: 0, stop: -1 };
  S.kassa = { lvl: 1, buffer: 0 };
  S.coach = { hired: false, capLvl: 0, trainLvl: 0 };
  S.abilities = newAbilities(); S.goldArea = -1;
  S.maxi.pepLvl = 0;
  S.effects = [];
  for (const s of S.sellers) { s.area = 0; s.pin = 0; s.evictedUntil = 0; }
  S.incomeSamples = []; S.incomeRate = 0;
  seatsDirty = true;
  return gain;
}

/* =========================================================================
   SPARNING (localStorage, try/catch överallt)
   ========================================================================= */
function serialize() { return JSON.stringify(S); }
function deepMerge(base, obj) {
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return obj === undefined ? base : obj;
  const out = Array.isArray(base) ? [] : { ...base };
  for (const k in obj) out[k] = (base && typeof base[k] === 'object' && base[k] && !Array.isArray(base[k])) ? deepMerge(base[k], obj[k]) : obj[k];
  return out;
}
function loadFrom(json) {
  const data = JSON.parse(json);
  if (!data || data.v !== 1 || !Array.isArray(data.sellers)) throw new Error('Ogiltig sparfil');
  const prev = S; newGame(); const fresh = S; S = prev;
  const merged = deepMerge(fresh, data);
  // Säkerställ att arrayer har rätt längd och fält
  merged.areas = CONFIG.area.unlockCost.map((c, i) => ({ ...newAreas()[i], ...(data.areas && data.areas[i]) }));
  for (const s of merged.sellers) { const d = makeSellerShape(); for (const k in d) if (s[k] === undefined) s[k] = d[k]; }
  merged.abilities = deepMerge(newAbilities(), data.abilities || {});
  S = merged; seatsDirty = true;
}
function makeSellerShape() { const p = S; S = null; const s = makeSeller('x', 0.2, false); S = p; return s; }
function save() {
  if (SIM) return;
  try { localStorage.setItem(CONFIG.saveKey, serialize()); } catch (e) { /* lagring ej tillgänglig – spelet fungerar ändå */ }
}
function loadSaved() {
  try { const j = localStorage.getItem(CONFIG.saveKey); if (j) { loadFrom(j); return true; } } catch (e) { console.warn('Kunde inte ladda sparfil:', e.message); }
  return false;
}
function exportSave() { try { return btoa(unescape(encodeURIComponent(serialize()))); } catch (e) { return ''; } }
function importSave(code) { const json = decodeURIComponent(escape(atob(code.trim()))); loadFrom(json); }

/* ---- Hus i områdena: varje område har en egen hustyp ---- */
const AREA_STYLES = [
  { kind: 'landshovding' }, { kind: 'brick' }, { kind: 'tower' }, { kind: 'colorful' },
  { kind: 'star' }, { kind: 'slab' }, { kind: 'villa' }, { kind: 'manor' },
];
const GROUND_Y = 142;
function windowsGrid(R, x, y, w, h, cols, rows, frame) {
  let o = ''; const cw = w / cols, rh = h / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const wx = x + c * cw + cw * 0.22, wy = y + r * rh + rh * 0.2, ww = cw * 0.56, wh = rh * 0.58;
    const lit = R() < 0.62;
    o += `<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="${ww.toFixed(1)}" height="${wh.toFixed(1)}" rx="1.5" fill="${lit ? '#ffd56e' : '#4a5873'}" stroke="${frame}" stroke-width="1"/>`;
    if (lit && R() < 0.3 && ww > 7) { const cx = wx + ww / 2, by = wy + wh - 1; o += `<path d="M${cx - 3.5} ${by} L${cx} ${by - 4} L${cx + 3.5} ${by}" stroke="#7a4a1a" stroke-width="1" fill="none"/><circle class="flick" cx="${cx}" cy="${by - 4.6}" r="1" fill="#ff9d1c"/>`; }
  }
  return o;
}
function tree(x, R, col) { const h = 26 + R() * 14; return `<rect x="${x - 2}" y="${GROUND_Y - 12}" width="4" height="12" fill="#7a4f2a"/><ellipse cx="${x}" cy="${GROUND_Y - 12 - h / 2.4}" rx="${10 + R() * 4}" ry="${h / 2}" fill="${col}"/>`; }

function streetSVG(ai) {
  const C = city(), st = AREA_STYLES[ai].kind, R = mulberry32(ai * 977 + S.cityIdx * 131 + 7);
  const wall = C.walls[ai]; const doors = []; let s = '';
  const frame = '#fff8';
  const add = (x, w, h, opts) => {
    const top = GROUND_Y - h;
    const col = opts.color || wall;
    if (opts.roof === 'pitch') s += `<path d="M${x - 4} ${top + 1} L${x + w / 2} ${top - 22} L${x + w + 4} ${top + 1}Z" fill="${opts.roofCol || '#5a3a3a'}"/>`;
    if (opts.roof === 'pyramid') s += `<path d="M${x - 2} ${top + 1} L${x + w / 2} ${top - 18} L${x + w + 2} ${top + 1}Z" fill="${shade(col, -25)}"/>`;
    if (opts.roof === 'turret') s += `<rect x="${x + w - 26}" y="${top - 18}" width="20" height="20" fill="${col}"/><path d="M${x + w - 29} ${top - 18} L${x + w - 16} ${top - 38} L${x + w - 3} ${top - 18}Z" fill="#5d6b7a"/><path d="M${x - 4} ${top + 1} L${x + 14} ${top - 14} L${x + w - 30} ${top - 14} L${x + w - 26} ${top + 1}Z" fill="#5d6b7a"/>`;
    s += `<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="3" fill="${col}" stroke="rgba(0,0,0,.18)" stroke-width="1.5"/>`;
    if (opts.base) s += `<rect x="${x}" y="${GROUND_Y - opts.base}" width="${w}" height="${opts.base}" fill="${opts.baseCol}" stroke="rgba(0,0,0,.18)" stroke-width="1.5"/>`;
    if (opts.roof === 'flat') s += `<rect x="${x - 3}" y="${top - 4}" width="${w + 6}" height="6" rx="2" fill="${shade(col, -22)}"/>`;
    if (opts.roof === 'low') s += `<path d="M${x - 4} ${top + 1} L${x + 8} ${top - 9} L${x + w - 8} ${top - 9} L${x + w + 4} ${top + 1}Z" fill="#6a3a2e"/>`;
    s += windowsGrid(R, x + 3, top + 4, w - 6, h - 40, opts.cols, opts.rows, frame);
    if (opts.balcony) for (let r = 0; r < opts.rows; r++) { const by = top + 4 + (r + 0.78) * ((h - 40) / opts.rows); s += `<rect x="${x + 4}" y="${by.toFixed(1)}" width="${w - 8}" height="3.5" rx="1" fill="${opts.balcony}"/>`; }
    for (const f of opts.doors) { const dx = x + w * f; doors.push(dx); s += `<rect x="${dx - 13}" y="${GROUND_Y - 34}" width="26" height="34" rx="4" fill="${shade(col, -18)}"/><rect x="${dx - 15}" y="${GROUND_Y - 37}" width="30" height="4" rx="2" fill="${shade(col, -30)}"/>`; }
  };
  // Bakgrund: träd
  for (let k = 0; k < 6; k++) s += tree(20 + k * 95 + R() * 30, R, shade(C.ground, -8 + R() * 10));
  switch (st) {
    case 'landshovding':
      for (let k = 0; k < 3; k++) add(10 + k * 170, 150, 100, { color: shade(wall, 0, k * 35 - 20), roof: 'pitch', roofCol: '#4a3a3a', base: 36, baseCol: '#8c7b6b', cols: 4, rows: 2, doors: [0.28, 0.72] });
      break;
    case 'brick':
      for (let k = 0; k < 3; k++) add(10 + k * 170, 150, 104, { color: shade(wall, k * 4 - 4), roof: 'low', cols: 5, rows: 3, doors: [0.3, 0.7] });
      break;
    case 'tower':
      for (let k = 0; k < 3; k++) add(16 + k * 170, 136, 132, { color: shade(wall, k * 5), roof: 'flat', cols: 4, rows: 6, doors: [0.3, 0.7] });
      break;
    case 'colorful': {
      const cols = [wall, '#f2b84b', '#7fc4a8'];
      for (let k = 0; k < 3; k++) add(12 + k * 170, 146, 122, { color: shade(cols[k], 4), roof: 'flat', cols: 5, rows: 5, balcony: shade(cols[(k + 1) % 3], -10), doors: [0.3, 0.7] });
      break;
    }
    case 'star':
      for (let k = 0; k < 3; k++) add(18 + k * 170, 132, 124, { color: shade(wall, k * 4), roof: 'pyramid', cols: 3, rows: 6, doors: [0.3, 0.7] });
      break;
    case 'slab':
      add(8, 504, 112, { color: wall, roof: 'flat', cols: 16, rows: 4, balcony: shade(wall, -20), doors: [1 / 12, 3 / 12, 5 / 12, 7 / 12, 9 / 12, 11 / 12] });
      break;
    case 'villa':
      for (let k = 0; k < 6; k++) {
        const col = k % 2 ? wall : shade(wall, -4, 40);
        add(8 + k * 86, 70, 72, { color: col, roof: 'pitch', roofCol: k % 2 ? '#8a3a2e' : '#4a4a5a', cols: 2, rows: 1, doors: [0.5] });
        s += `<rect x="${4 + k * 86}" y="${GROUND_Y - 8}" width="78" height="8" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      }
      break;
    default: // manor
      for (let k = 0; k < 3; k++) add(10 + k * 170, 150, 104, { color: shade(wall, k * 3), roof: 'turret', cols: 4, rows: 2, base: 10, baseCol: shade(wall, -20), doors: [0.25, 0.62] });
  }
  // Trottoar
  s += `<rect x="-300" y="${GROUND_Y}" width="900" height="28" fill="#d8ccb6"/><rect x="-300" y="${GROUND_Y}" width="900" height="3" fill="#bfae92"/>`;
  return { svg: `<svg class="bld" width="520" height="170" viewBox="0 0 520 170" overflow="visible">${s}</svg>`, doors };
}

/* =========================================================================
   VISUELLT LAGER (VIS): figurer, dörrar, flygande siffror, bilen
   ========================================================================= */
const HOME_H = 270, ROW_H = 196;
const VIS = {
  rows: [], sprites: new Map(), floats: 0, pend: new Map(), lastCarTier: -1,
  onSale(s, i, gain) { const p = this.pend.get(s.id) || { amt: 0, t: 0 }; p.amt += gain; this.pend.set(s.id, p); },
  outcome(s, kind) { const sp = this.sprites.get(s.id); if (!sp) return; const pr = { full: 0, closed: 1, no: 2, sale: 3 }; if (!sp.out || pr[kind] > pr[sp.out]) sp.out = kind; },
  unload(amt) {
    const d = $('#soranDesk'); if (!d) return;
    const el = document.createElement('div'); el.className = 'coin'; el.textContent = '+' + kr(amt);
    el.style.left = (20 + Math.random() * 50) + 'px'; el.style.top = '10px'; d.appendChild(el); setTimeout(() => el.remove(), 900);
  },
  rebuildCar() {
    const car = $('#car'); if (!car) return;
    car.innerHTML = carSVG(S.car.tier) + '<div class="load"></div><div class="flatTag">PUNKA!</div>';
    this.lastCarTier = S.car.tier; this.carLen = CAR_STYLE[S.car.tier].len;
  },
  carY(p) {
    const yHome = 150, pts = [yHome];
    for (let i = 0; i < S.areas.length; i++) pts.push(HOME_H + i * ROW_H + ROW_H / 2 - (this.carLen || 60) / 2);
    const k = clamp(Math.floor(p), 0, pts.length - 2), f = p - k;
    return pts[k] + (pts[k + 1] - pts[k]) * f;
  },
  float(parent, x, y, text, big) {
    if (this.floats > 45) return;
    const el = document.createElement('div'); el.className = 'float' + (big ? ' big' : ''); el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px'; parent.appendChild(el); this.floats++;
    setTimeout(() => { el.remove(); this.floats--; }, 1300);
  },
  door(row, d, kind, text) {
    const el = row.doorEls[d]; if (!el) return;
    el.classList.remove('open', 'knock');
    void el.offsetWidth;
    el.classList.add(kind === 'closed' ? 'knock' : 'open');
    if (text) { const b = document.createElement('div'); b.className = 'bub ' + (kind === 'sale' ? 'yes' : kind === 'no' ? 'no' : 'kn'); b.textContent = text; el.appendChild(b); setTimeout(() => b.remove(), 1100); }
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('open', 'knock'), kind === 'closed' ? 650 : 1000);
  },

  // Synkar figurerna mot vilka som sitter i bilen
  syncSprites() {
    const want = new Set();
    for (const s of S.sellers) {
      if (!s.seated) continue;
      const row = this.rows[s.area]; if (!row || !row.street) continue;
      want.add(s.id);
      let sp = this.sprites.get(s.id);
      if (sp && (sp.area !== s.area || sp.team !== s.team)) { sp.el.remove(); this.sprites.delete(s.id); sp = null; }
      if (!sp) {
        const el = document.createElement('div'); el.className = 'seller';
        el.innerHTML = sellerSVG(s) + `<div class="nm">${esc(s.name)}${s.maxi ? ' ·M' : ''}</div>`;
        row.street.appendChild(el);
        const x = row.doors[Math.floor(Math.random() * row.doors.length)] + rand(-30, 30);
        sp = { el, area: s.area, team: s.team, x, door: -1, mode: 'walk', t: 0, out: null, faceL: false };
        this.sprites.set(s.id, sp); this.pickDoor(sp, row);
      }
    }
    for (const [id, sp] of this.sprites) if (!want.has(id)) { sp.el.remove(); this.sprites.delete(id); }
  },
  pickDoor(sp, row) { let d; do { d = Math.floor(Math.random() * row.doors.length); } while (row.doors.length > 1 && d === sp.door); sp.door = d; sp.mode = 'walk'; },

  frame(dt) {
    // Figurer
    for (const s of S.sellers) {
      const sp = this.sprites.get(s.id); if (!sp) continue;
      const row = this.rows[s.area]; if (!row || !row.street) continue;
      const evicted = s.evictedUntil > S.time;
      const full = S.areas[s.area].bag >= bagCap(s.area);
      sp.el.classList.toggle('evicted', evicted);
      if (evicted || full) { sp.el.classList.remove('walk'); sp.el.classList.add('idle'); }
      else if (sp.mode === 'walk') {
        sp.el.classList.remove('idle');
        const tx = row.doors[sp.door] + 14, dx = tx - sp.x, step = 95 * dt;
        if (Math.abs(dx) <= step) { sp.x = tx; sp.mode = 'knock'; sp.t = 0.75; sp.out = null; sp.el.classList.remove('walk'); sp.faceL = true; }
        else { sp.x += Math.sign(dx) * step; sp.faceL = dx < 0; sp.el.classList.add('walk'); }
      } else if (sp.mode === 'knock') {
        if (sp.t === 0.75) { /* första frame */ }
        sp.t -= dt;
        if (sp.t <= 0.45 && !sp.shown) {
          sp.shown = true;
          const k = sp.out || 'closed';
          this.door(row, sp.door, k === 'sale' ? 'sale' : k === 'no' ? 'no' : 'closed', k === 'sale' ? 'Ja tack!' : k === 'no' ? pick(['Nej tack!', 'Nej tack', 'Har redan!', 'Inte idag']) : 'knack knack');
        }
        if (sp.t <= 0) { sp.shown = false; this.pickDoor(sp, row); }
      }
      sp.el.classList.toggle('left', sp.faceL);
      sp.el.style.transform = `translateX(${(sp.x - 13).toFixed(1)}px)`;
      // flygande vinst
      const p = this.pend.get(s.id);
      if (p) { p.t -= dt; if (p.t <= 0 && p.amt > 0) { this.float(row.street, sp.x, 96, '+' + kr(p.amt), p.amt > salePrice(s.area) * 2); p.amt = 0; p.t = 0.45; } }
    }
    // Bilen
    const car = $('#car');
    if (car) {
      if (this.lastCarTier !== S.car.tier) this.rebuildCar();
      const c = S.car;
      car.style.top = this.carY(c.pos).toFixed(1) + 'px';
      const goingUp = c.phase === 'move' && c.target < c.pos;
      const svg = car.firstElementChild; if (svg) svg.style.transform = goingUp ? 'rotate(180deg)' : '';
      const ld = car.querySelector('.load'); if (ld) { ld.textContent = c.load > 0 ? kr(c.load) : 'tom'; ld.style.opacity = c.load > 0 ? 1 : .55; }
      car.classList.toggle('flat', !!effect('punka'));
    }
  },
};

  modal(title, body, buttons = [{ label: 'OK' }], opts = {}) { modalQueue.push({ title, body, buttons, opts }); if (!modalOpen) this.nextModal(); },
  nextModal() {
    const L = $('#modalLayer'); const m = modalQueue.shift();

    L.classList.add('on');

  confirm(title, body, yes, label = 'Ja', cls = 'red') { this.modal(title, body, [{ label: 'Avbryt', cls: '' }, { label, cls, fn: yes }]); },
  toast(title, text, kind = '', btn) {
    const t = document.createElement('div'); t.className = 'toast ' + kind;
    t.innerHTML = `<b>${title}</b>${text}`;
    if (btn) { const b = document.createElement('button'); b.className = 'orange'; b.textContent = btn.label; b.onclick = () => { if (btn.fn() !== false) close(); }; t.appendChild(b); }
    const box = $('#toasts'); box.prepend(t);
    while (box.children.length > 5) box.lastChild.remove();
    const close = () => { t.classList.add('out'); setTimeout(() => t.remove(), 350); };
    setTimeout(close, btn ? 12000 : 6500);

function tipFor(key) {
  const [k, a] = key.split(':'); const i = +a;
  const ms = L => { const m = nextMilestone(L); return m ? `\nNästa milstolpe: nivå ${m}` : ''; };
  switch (k) {
    case 'area': {
      const L = S.areas[i].level, b = bulkInfo(CONFIG.area.upgradeBase[i], L), N = L + b.n;
      const m = nextMilestone(L);
      return `<b>${esc(areaName(i))} nivå ${L} → ${N}</b>\nDörrtakt: ${fmt1(knockRateAt(L))} → ${fmt1(knockRateAt(N))} knack/s per säljare\nSäljpåse: ${kr(bagCapAt(i, L))} → ${kr(bagCapAt(i, N))}\nSäljarplatser: ${areaSeatsAt(L)} → ${areaSeatsAt(N)}${m ? `\nMilstolpe nivå ${m}: dubbel dörrtakt${CONFIG.area.seatsAt.includes(m) ? ' + 1 säljarplats' : ''}` : ''}\nKostnad: ${kr(b.cost)}`;
    }
    case 'areaInfo': { const w = areaWorkers(i); return `<b>${esc(areaName(i))}</b>\nKöpkraft ×${fmt(buyPower(i))}: en ${esc(product().name.toLowerCase())} kostar här ${kr(salePrice(i))}\nÖppnar dörren: ${pctStr(openChance(i))}\nSäljare här: ${w.map(s => esc(s.name)).join(', ') || 'ingen'}`; }
    case 'bag': return `<b>Säljpåse</b>\nVinsten från försäljningarna samlas här tills Arvin hämtar den.\nNär påsen är full slutar säljarna sälja!`;
    case 'carCap': { const L = S.car.capLvl, b = bulkInfo(CONFIG.car.capCostBase, L); return `<b>Bilens kapacitet nivå ${L} → ${L + b.n}</b>\n${kr(carCapAt(L))} → ${kr(carCapAt(L + b.n))} per tur${ms(L)}: dubbel kapacitet\nKostnad: ${kr(b.cost)}`; }
    case 'carSpeed': { const L = S.car.speedLvl, b = bulkInfo(CONFIG.car.speedCostBase, L); return `<b>Bilens fart nivå ${L} → ${L + b.n}</b>\n${fmt1(carSpeedAt(L))} → ${fmt1(carSpeedAt(L + b.n))} områden/s${ms(L)}: dubbel fart\nKostnad: ${kr(b.cost)}`; }
    case 'kassa': { const L = S.kassa.lvl, b = bulkInfo(CONFIG.kassa.costBase, L); return `<b>Kassan nivå ${L} → ${L + b.n}</b>\nSoran räknar ${kr(kassaRateAt(L))}/s → ${kr(kassaRateAt(L + b.n))}/s${ms(L)}: dubbel takt\nKostnad: ${kr(b.cost)}`; }
    case 'ab': {
      const c = CONFIG.abilities[a], st = S.abilities[a];
      const d = { pep: `Alla säljares säljprocent ×1,25 (max 60 %) i ${abilityDuration(a)} s.`, recruit: '3 nya kandidater direkt med 25–45 % säljprocent.', gas: `Bilen åker 3× snabbare i ${abilityDuration(a)} s.`, gold: `Dubbelt så många dörrar öppnas i valt område i ${abilityDuration(a)} s (max 50 %).` }[a];
      return `<b>${c.name}</b> (nivå ${st.lvl})\n${d}\nCooldown: ${timeStr(abilityCooldown(a))}\nUppgradera genom att klicka på porträttet.`;
    }
    case 'mgr': return { soran: '<b>Soran</b>\nKlicka för att uppgradera Sorans förmågor.', arvin: '<b>Arvin</b>\nKlicka för att uppgradera Arvins förmågor.', maxi: '<b>Maxi</b>\nKlicka för att öppna Maxi-fliken.' }[a];
    case 'seller': { const s = S.sellers.find(x => x.id === i); if (!s) return ''; return `<b>${esc(s.name)}</b> ${s.team}-laget\nSäljprocent ${pctStr(s.pct)} (just nu ${pctStr(salePct(s, s.area), 1)})\nSitter på bänken.`; }
    case 'maxiIcon': return '<b>Maxis säljare</b>\nMaxi värvade den här säljaren och får 17,5 % i stället för 10 %.';
    case 'week': return `<b>Spelvecka</b>\n1 vecka = 3 minuter. När veckan är slut rankas säljarna efter klasar per arbetad minut och nya kandidater dyker upp.`;
    case 'rykte': return `<b>Rykte</b>\nFås när du expanderar till en ny stad.\nVarje stjärna ger +${Math.round(CONFIG.prestige.perRykte * 100)} % inkomst för alltid.`;
    case 'buymode': return '<b>Köpmängd</b>\nHur många nivåer en uppgraderingsknapp köper: 1, 10, 50 eller MAX (så många du har råd med).';
    case 'prod': { const p = CONFIG.products[i]; return `<b>${esc(p.name)}</b>\nBaspris ${kr(p.price)} per klase\nI ${esc(areaName(unlockedCount() - 1))}: ${kr(p.price * buyPower(unlockedCount() - 1))}\nSäljpåsarnas tak följer produktens pris.`; }
    case 'tier': { const t = CONFIG.car.ladder[i]; return `<b>${t.name}</b>\n${t.seats} platser = ${t.seats} säljare kan jobba samtidigt.`; }
    case 'effects': { const n = { lonedag: 'Lönedag', jul: 'Julstämning', granne: 'Grannchatten', regn: 'Regnväder', punka: 'Punka', evict: 'Utkastad', slut: 'Leverantören har slut' };
      return '<b>Aktiva effekter</b>\n' + S.effects.map(e => `${n[e.type]}${e.area !== undefined ? ' – ' + esc(areaName(e.area)) : ''}${e.name ? ' – ' + esc(e.name) : ''}: ${timeStr(e.until - S.time)}`).concat(['pep', 'gas', 'gold'].filter(abilityActive).map(k => `${CONFIG.abilities[k].name}: ${timeStr(S.abilities[k].until - S.time)}`)).join('\n'); }
    case 'units': return 'tn = tusen, mn = miljoner, md = miljarder, bn = biljoner, bd = biljarder';
  }
  return '';
}
