<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>LjusCo Tycoon</title>
<!--
  LjusCo Tycoon v2 – ett tycoon-spel om LjusCo, dörrförsäljning av ljusklasar i Göteborg.
  Spelet går dag för dag: MORGON (planering) → ARBETSDAG (5 min) → DAGSRAPPORT.
  En enda fil: HTML + CSS + vanilla JavaScript. Inga externa bilder eller bibliotek.
  Allt som är kul att mixtra med (säljare, priser, events, pitch-repliker, balans) ligger i CONFIG.
-->
<style>
/* =========================================================================
   FÄRGER OCH GRUND
   ========================================================================= */
:root {
  --plum: #2b1838; --plum2: #43264f;
  --cream: #fff7e8; --cream2: #fbebcd; --card: #fffdf7;
  --ink: #3b2716; --ink2: #7a6046;
  --orange: #ff8a3d; --orange2: #e86a1c;
  --gold: #ffc94a; --gold2: #f0a91c;
  --green: #4fb36a; --green2: #2f8f4c;
  --red: #e5534b; --blue: #4a8fd8; --teal: #2fa3a0; --purple: #8a4fc4;
  --shadow: 0 4px 0 rgba(59, 39, 22, .18), 0 8px 18px rgba(59, 39, 22, .14);
  --shadow-s: 0 2px 0 rgba(59, 39, 22, .2), 0 4px 10px rgba(59, 39, 22, .12);
  --panel-w: 480px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-width: 1280px; background: var(--plum); color: var(--ink);
  font-family: "Nunito", "Segoe UI Rounded", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; overflow: hidden; user-select: none;
}
button {
  font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 7px 12px;
  background: var(--cream2); color: var(--ink); font-weight: 800;
  box-shadow: 0 3px 0 rgba(59,39,22,.25); transition: transform .08s, filter .15s, background .15s;
}
button:hover:not(:disabled) { filter: brightness(1.06); }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(59,39,22,.25); }
button:disabled { opacity: .5; cursor: default; filter: grayscale(.4); }
button.buy { background: #d9d0bf; color: #6d604f; }
button.buy.can { background: linear-gradient(#7fd48c, var(--green)); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
button.orange { background: linear-gradient(#ffab6b, var(--orange)); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
button.green { background: linear-gradient(#7fd48c, var(--green)); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
button.red { background: linear-gradient(#f07a73, var(--red)); color: #fff; }
button.ghost { background: transparent; box-shadow: none; text-decoration: underline; padding: 4px 6px; }
button.small { padding: 4px 9px; font-size: 12px; border-radius: 9px; }
button.big { font-size: 18px; padding: 12px 22px; border-radius: 16px; }
select { font: inherit; font-weight: 700; font-size: 12px; border-radius: 8px; border: 2px solid #e2d3b6; background: #fff; padding: 3px 4px; color: var(--ink); }

/* =========================================================================
   TOPPBAR
   ========================================================================= */
#topbar {
  height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: linear-gradient(#4a2a57, var(--plum)); color: #fff; border-bottom: 3px solid #1d0f27;
  position: relative; z-index: 20;
}
.logo { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 18px; white-space: nowrap; }
.logo b { color: var(--gold); }
.stat { background: rgba(255,255,255,.1); border-radius: 14px; padding: 5px 10px; display: flex; flex-direction: column; line-height: 1.15; min-width: 82px; }
.stat small { font-size: 11px; opacity: .75; font-weight: 700; white-space: nowrap; }
.stat span { font-size: 16px; font-weight: 900; white-space: nowrap; }
.stat.cash span { color: var(--gold); font-size: 19px; }
.stat.clickable { cursor: pointer; }
.stat.clickable:hover { background: rgba(255,255,255,.18); }
.stat.warn { background: rgba(229,83,75,.45); animation: pulse 1.2s infinite; }
#dayBox { min-width: 170px; }
#dayBox .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; margin-top: 2px; }
#dayBox .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--orange)); }
#effects { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; align-items: center; overflow: hidden; height: 56px; align-content: center; min-width: 0; }
.chip { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: #fff; color: var(--ink); white-space: nowrap; animation: pop .3s; }
.chip.good { background: #d7f5d8; color: #1f6b33; }
.chip.bad { background: #ffd9d4; color: #9b2a22; }
.chip.ability { background: #ffe9b8; color: #7a4d00; }
#buyMode { display: flex; background: rgba(0,0,0,.25); border-radius: 12px; padding: 3px; }
#buyMode button { padding: 4px 8px; background: transparent; color: #fff; box-shadow: none; font-size: 12px; }
#buyMode button.on { background: var(--gold); color: var(--ink); }
#settingsBtn { background: rgba(255,255,255,.14); color: #fff; font-size: 18px; padding: 6px 10px; }

/* =========================================================================
   HUVUDLAYOUT
   ========================================================================= */
#main { display: flex; height: calc(100vh - 64px); overflow: hidden; }
#left { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
#scene { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; background: #3b2147; scrollbar-width: thin; }
#world { position: relative; width: 100%; min-width: 790px; }
#phaseBanner {
  position: absolute; left: 50%; bottom: 116px; transform: translateX(-50%); z-index: 15;
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 14px;
  display: none; align-items: center; gap: 12px; font-weight: 800; white-space: nowrap;
}
#phaseBanner.on { display: flex; animation: pop .3s; }
#phaseBanner .ph-t { font-size: 15px; }
#phaseBanner .ph-s { font-size: 12px; color: var(--ink2); }

/* Vägen */
#road { position: absolute; left: 0; top: 150px; bottom: 0; width: 96px; background: #4d4a52; border-right: 5px solid #d9cfba; border-left: 5px solid #d9cfba; z-index: 3; }
#road::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: repeating-linear-gradient(#f5e9b0 0 18px, transparent 18px 36px); opacity: .8; }
#car { position: absolute; left: 24px; width: 48px; z-index: 6; will-change: top; cursor: pointer; }
#car svg { display: block; transition: transform .25s; }
#car .load { position: absolute; left: 50px; top: 50%; transform: translateY(-50%); background: #fff; border-radius: 10px; padding: 2px 7px; font-weight: 900; font-size: 12px; box-shadow: var(--shadow-s); white-space: nowrap; color: var(--green2); pointer-events: none; }
#car.flat svg { animation: shake .25s infinite; }
#car .flatTag { position: absolute; left: 50px; top: -8px; background: var(--red); color: #fff; border-radius: 8px; padding: 1px 6px; font-size: 11px; font-weight: 900; display: none; white-space: nowrap; }
#car.flat .flatTag { display: block; }
#car.away svg { opacity: .25; }
.boostTag { position: absolute; background: #2b1838; color: var(--gold); border-radius: 8px; padding: 1px 6px; font-size: 11px; font-weight: 900; white-space: nowrap; display: none; pointer-events: none; }
.boostTag.on { display: block; }
#car .boostTag { left: 50px; bottom: -8px; }

/* Hemma */
#home { position: relative; height: 270px; overflow: hidden; }
#home .homeBg { position: absolute; inset: 0; }
.homeCard { position: absolute; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 9px 11px; z-index: 4; }
#kassaCard { left: 112px; top: 148px; width: 238px; cursor: pointer; }
#carCard { left: 112px; top: 14px; width: 238px; }
#benchCard { right: 14px; top: 150px; width: 300px; min-height: 104px; }
.homeCard h4 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.homeCard .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); font-weight: 700; }
.homeCard button.buy { width: 100%; margin-top: 6px; }
.homeCard .two { display: flex; gap: 6px; }
.homeCard .two button { flex: 1; font-size: 12px; padding: 6px 4px; }
#kassaCard .boostTag { right: 10px; top: -10px; }
#soranDesk { position: absolute; left: 370px; top: 140px; width: 140px; height: 124px; z-index: 3; cursor: pointer; }
#soranDesk .coin { position: absolute; font-weight: 900; color: var(--gold2); animation: coin .9s ease-out forwards; font-size: 13px; text-shadow: 0 1px 0 #fff; }
#bench { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.benchie { display: flex; flex-direction: column; align-items: center; width: 34px; font-size: 9px; font-weight: 800; color: var(--ink2); text-align: center; line-height: 1; cursor: pointer; }
.benchie.go { color: var(--green2); }
.benchie svg { display: block; }

/* Områden */
.area { position: relative; height: 196px; overflow: hidden; border-top: 4px solid rgba(0,0,0,.18); }
.area .sky { position: absolute; inset: 0; }
.area .ground { position: absolute; left: 96px; right: 0; top: 164px; height: 32px; background: #d8ccb6; border-top: 3px solid #bfae92; }
.area .street { position: absolute; left: 286px; top: 22px; width: 520px; height: 168px; cursor: pointer; }
.area .street svg.bld { position: absolute; left: 0; top: 0; }
.areaInfo { position: absolute; left: 108px; top: 12px; width: 168px; bottom: 12px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 8px 10px; z-index: 4; display: flex; flex-direction: column; gap: 3px; }
.areaInfo h3 { margin: 0; font-size: 16px; line-height: 1.1; }
.areaInfo .meta { font-size: 11px; color: var(--ink2); font-weight: 800; }
.areaInfo .bagWrap { display: flex; align-items: center; gap: 6px; }
.areaInfo .bagText { font-size: 11px; font-weight: 800; line-height: 1.2; }
.areaInfo .bagText b { font-size: 13px; }
.areaInfo button { font-size: 12px; padding: 6px 4px; margin-top: auto; }
.areaInfo .boostTag { right: 8px; top: 8px; }
.bagSvg .fill { transition: height .2s, y .2s; }
.bagWrap.full .bagSvg { animation: pulse .8s infinite; }
.bagWrap.full .bagText { color: var(--red); }
.area.locked .street, .area.locked .sky, .area.locked .ground { filter: grayscale(.85) brightness(.55); }
.lockBox { position: absolute; left: 330px; top: 50px; z-index: 5; text-align: center; background: var(--card); border-radius: 18px; padding: 14px 22px; box-shadow: var(--shadow); }
.lockBox h3 { margin: 0 0 4px; }
.lockBox p { margin: 0 0 8px; color: var(--ink2); font-weight: 700; font-size: 12px; }
.fullNote { position: absolute; left: 300px; top: 8px; background: var(--red); color: #fff; padding: 2px 10px; border-radius: 10px; font-weight: 900; font-size: 12px; z-index: 5; display: none; animation: pulse .9s infinite; }
.area.isFull .fullNote { display: block; }
.stop { position: absolute; left: 76px; top: 86px; width: 26px; height: 26px; z-index: 4; }

/* Dörrar */
.door { position: absolute; width: 20px; height: 29px; z-index: 2; }
.door .inside { position: absolute; inset: 0; background: #ffcf6e; border-radius: 3px 3px 0 0; box-shadow: inset 0 0 8px #ff9f2e; }
.door .leaf { position: absolute; inset: 0; border-radius: 3px 3px 0 0; transform-origin: left center; transition: transform .25s ease-out; border: 2px solid rgba(0,0,0,.25); }
.door .leaf::after { content: ""; position: absolute; right: 3px; top: 13px; width: 3px; height: 3px; border-radius: 50%; background: #f6d36b; }
.door.open .leaf { transform: perspective(70px) rotateY(-72deg); }
.door.knock .leaf { animation: knock .3s 2; }
.door .bub { position: absolute; bottom: 33px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 10px; padding: 2px 7px; font-size: 11px; font-weight: 900; white-space: nowrap; box-shadow: var(--shadow-s); animation: bub 1.1s ease-out forwards; pointer-events: none; z-index: 8; }
.door .bub.no { color: #9b4a3a; }
.door .bub.yes { color: var(--green2); }
.door .bub.kn { color: #8a7a6a; background: #f4ecdf; }

/* Säljarfigurer */
.seller { position: absolute; top: 118px; width: 26px; height: 50px; z-index: 6; will-change: transform; cursor: pointer; }
.seller svg { display: block; }
.seller .fig { transition: transform .15s; }
.seller.left .fig { transform: scaleX(-1); }
.seller.walk .lg1 { animation: legA .32s infinite alternate; }
.seller.walk .lg2 { animation: legB .32s infinite alternate; }
.seller.walk .fig { animation: bob .32s infinite alternate; }
.seller .nm { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 900; color: #fff; background: rgba(43,24,56,.75); padding: 0 4px; border-radius: 6px; white-space: nowrap; }
.seller .nm i { font-style: normal; color: var(--gold); }
.seller.dim { opacity: .45; }
.seller .tag { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: #fff; color: var(--red); border-radius: 9px; padding: 1px 6px; font-size: 10px; font-weight: 900; white-space: nowrap; box-shadow: var(--shadow-s); display: none; }
.seller.empty .tag, .seller.paused .tag { display: block; }
.seller.paused .tag { color: var(--ink2); }
.pitchBub {
  position: absolute; z-index: 9; top: 66px; transform: translateX(-50%); cursor: pointer;
  background: linear-gradient(#ffe27a, #ffb21c); color: #6a2a00; border: 3px solid #fff; border-radius: 14px;
  font-weight: 900; font-size: 14px; padding: 3px 10px; box-shadow: 0 0 0 3px #ff8a3d, 0 6px 14px rgba(0,0,0,.3);
  animation: blink .45s infinite alternate;
}
.pitchBub small { display: block; height: 4px; background: rgba(0,0,0,.15); border-radius: 2px; margin-top: 2px; overflow: hidden; }
.pitchBub small i { display: block; height: 100%; background: #6a2a00; }

/* Flygande siffror, tap och level up */
.float { position: absolute; z-index: 9; pointer-events: none; font-weight: 900; font-size: 14px; color: #2f9e4c; text-shadow: 0 1px 0 #fff, 0 0 4px #fff; white-space: nowrap; animation: floatUp 1.3s ease-out forwards; }
.float.big { font-size: 18px; color: var(--gold2); }
.float.lvl { font-size: 17px; color: #fff; background: linear-gradient(#b36cf0, var(--purple)); padding: 1px 8px; border-radius: 10px; text-shadow: none; animation: floatUp 1.8s ease-out forwards; }
.tapRing { position: fixed; z-index: 70; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 4px solid var(--gold); pointer-events: none; animation: tap .5s ease-out forwards; }

/* =========================================================================
   MANAGER-RAD
   ========================================================================= */
#managers { height: 104px; flex: none; background: linear-gradient(#5a3468, #3a1f47); border-top: 3px solid #1d0f27; display: flex; gap: 8px; padding: 9px 10px; align-items: stretch; overflow: hidden; }
.mgr { background: var(--cream); border-radius: 16px; display: flex; gap: 6px; padding: 6px 6px; flex: none; box-shadow: var(--shadow-s); align-items: center; }
.mgr .who { display: flex; flex-direction: column; align-items: center; width: 56px; text-align: center; line-height: 1.1; }
.mgr .who b { font-size: 13px; }
.mgr .who small { font-size: 10px; color: var(--ink2); font-weight: 800; }
.mgr .portrait { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: #ffe2b0; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15); cursor: pointer; }
.ability { width: 98px; display: flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 6px 8px; background: linear-gradient(#ffd77e, var(--gold)); text-align: left; position: relative; }
.ability .an { font-size: 11px; line-height: 1.1; letter-spacing: -.2px; }
.ability .as { font-size: 10.5px; font-weight: 800; color: #6d4a00; }
.ability .ab { height: 6px; border-radius: 4px; background: rgba(0,0,0,.15); overflow: hidden; }
.ability .ab i { display: block; height: 100%; background: #fff; width: 0; }
.ability.active { background: linear-gradient(#a8ef9f, var(--green)); color: #fff; }
.ability.active .as { color: #eaffea; }
.ability.cd { background: #e2d8c6; }
.mgr.maxi { flex: 1; min-width: 0; }
.mgr.maxi .mtext { font-size: 11.5px; font-weight: 800; flex: 1; min-width: 0; line-height: 1.25; }
.mgr.maxi .mtext span { color: var(--green2); }
.mgr.gone { opacity: .6; }

/* =========================================================================
   SIDOPANEL
   ========================================================================= */
#panel { width: var(--panel-w); flex: none; background: var(--cream); display: flex; flex-direction: column; min-height: 0; border-left: 4px solid #1d0f27; }
#tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 6px 8px 0; background: var(--plum2); }
#tabs button { border-radius: 10px 10px 0 0; padding: 6px 2px; font-size: 13px; background: #7a5a86; color: #f6e6ff; box-shadow: none; }
#tabs button.on { background: var(--cream); color: var(--ink); }
#tabs button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-left: 3px; vertical-align: middle; }
#tabBody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }
.sec { background: var(--card); border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; box-shadow: var(--shadow-s); }
.sec h3 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.sec p { margin: 4px 0; color: var(--ink2); font-weight: 600; font-size: 13px; }
.sec .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.warnBox { background: #ffe1dc; color: #9b2a22; border-radius: 10px; padding: 6px 9px; font-weight: 800; font-size: 12px; margin-top: 6px; }
.okBox { background: #dff5df; color: #1f6b33; border-radius: 10px; padding: 6px 9px; font-weight: 800; font-size: 12px; margin-top: 6px; }
.muted { color: var(--ink2); font-size: 12px; font-weight: 700; }
.stars { letter-spacing: -1px; font-size: 13px; white-space: nowrap; }
.stars .s { color: #e3d7c3; }
.stars .s.c { color: var(--gold2); }
.stars .s.p { color: var(--gold2); opacity: .35; }
.stars .s.h { background: linear-gradient(90deg, var(--gold2) 50%, #f3d79d 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stars.gold .s.c { color: #ffb800; text-shadow: 0 0 6px #ffd76a; }
.badge { display: inline-block; font-size: 11px; font-weight: 900; padding: 1px 7px; border-radius: 8px; background: #eee3cf; color: var(--ink); vertical-align: middle; white-space: nowrap; }
.badge.A { background: var(--gold); }
.badge.B { background: #bfe1f5; }
.badge.trial { background: #ffd2e4; }
.badge.seat { background: #c9efcc; color: #1f6b33; }
.badge.bench { background: #e8e0d4; color: #7a6a5a; }
.badge.evict { background: #ffd9d4; color: #9b2a22; }
.badge.lvl { background: #e7d5fb; color: #5a2a8a; }
.maxiIcon { display: inline-flex; width: 18px; height: 18px; vertical-align: middle; }
.cands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cand { background: var(--cream2); border-radius: 12px; padding: 7px; text-align: center; display: flex; flex-direction: column; gap: 3px; }
.cand b { font-size: 14px; }
.cand .via { font-size: 10px; font-weight: 900; border-radius: 8px; padding: 1px 4px; background: #e0d2f0; color: #5a2a7a; }
.cand .via.maxi { background: #ffd28f; color: #7a3d00; }
.cand button { font-size: 12px; padding: 5px 4px; }
.ladder { display: flex; flex-direction: column; gap: 6px; }
.lrow { display: flex; align-items: center; gap: 9px; padding: 7px; border-radius: 12px; background: var(--cream2); }
.lrow.cur { background: #ffe7a8; outline: 3px solid var(--gold); }
.lrow.owned { opacity: .7; }
.lrow .ic { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 10px; }
.lrow .tx { flex: 1; line-height: 1.25; min-width: 0; }
.lrow .tx b { font-size: 14px; }
.lrow .tx small { display: block; color: var(--ink2); font-weight: 700; font-size: 12px; }
.lrow .bb { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 210px; }
.lrow .bb button { font-size: 11px; padding: 4px 6px; }
table.rep { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rep td, table.rep th { padding: 4px 3px; border-bottom: 1px dashed #eadcc4; }
table.rep td:last-child, table.rep th:last-child { text-align: right; font-weight: 800; }
table.rep th { text-align: left; font-size: 12px; color: var(--ink2); }
table.rep tr.tot td { font-weight: 900; font-size: 14px; border-bottom: 0; color: var(--green2); }
table.rep tr.sub td { padding-left: 14px; color: var(--ink2); font-size: 12px; }
table.rep.num td:not(:first-child), table.rep.num th:not(:first-child) { text-align: right; }
.upRow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed #eadcc4; }
.upRow:first-of-type { border-top: 0; }
.upRow .tx { flex: 1; font-weight: 700; font-size: 13px; line-height: 1.25; }
.upRow .tx small { display: block; color: var(--ink2); font-size: 11px; }
.upRow button { min-width: 120px; font-size: 12px; }
.bigPortrait { width: 92px; height: 92px; border-radius: 50%; overflow: hidden; background: #ffe2b0; border: 4px solid #fff; box-shadow: var(--shadow-s); flex: none; display: flex; align-items: center; justify-content: center; }
.prog { height: 8px; background: #eadfcb; border-radius: 5px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--green); }
.prog.xp i { background: linear-gradient(90deg, #b36cf0, var(--purple)); }

/* FIFA-säljarkort */

.scard .rate b { display: block; font-size: 22px; line-height: 1; }
.scard .rate small { font-size: 10px; font-weight: 900; color: var(--ink2); }
.scard .rate.elite { background: linear-gradient(#e7d5fb, #b88ae8); }

.scard .l2 { font-size: 11.5px; color: var(--ink2); font-weight: 700; margin-top: 2px; }
.scard .bars { display: flex; gap: 6px; align-items: center; margin-top: 3px; font-size: 10px; font-weight: 900; color: var(--ink2); }
.scard .bars .prog { flex: 1; height: 6px; }
.potbar { position: relative; height: 8px; background: #eadfcb; border-radius: 5px; overflow: hidden; }
.potbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold2); }
.potbar u { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); opacity: .35; }
.scard .acts { display: flex; flex-direction: column; gap: 4px; }
.fifa { display: flex; gap: 16px; align-items: stretch; }
.fifa .face { width: 150px; flex: none; border-radius: 18px; background: linear-gradient(160deg, #ffe7a3, #f0a91c); display: flex; flex-direction: column; align-items: center; padding: 10px; box-shadow: var(--shadow-s); }
.fifa .face.elite { background: linear-gradient(160deg, #eedcff, #8a4fc4); color: #fff; }
.fifa .face .big { font-size: 40px; font-weight: 900; line-height: 1; }
.fifa .face .pot { font-size: 13px; font-weight: 900; opacity: .8; }
.fifa .info { flex: 1; }

/* Morgonplanering */
.mrow { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-top: 1px dashed #eadcc4; font-size: 12px; }
.mrow:first-of-type { border-top: 0; }
.mrow input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; }
.mrow .nm { flex: 1; min-width: 0; font-weight: 800; font-size: 13px; }
.mrow .nm small { color: var(--ink2); font-weight: 700; }
.mrow select { max-width: 130px; }
.mrow.off { opacity: .6; }

/* =========================================================================
   MODALER, TOASTS, TOOLTIP, RAPPORTER
   ========================================================================= */
#modalLayer { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(30, 14, 40, .55); }
#modalLayer.on { display: flex; }
.modal { background: var(--cream); border-radius: 22px; padding: 18px 20px; width: 520px; max-height: 88vh; overflow-y: auto; box-shadow: 0 10px 0 rgba(0,0,0,.2), 0 20px 50px rgba(0,0,0,.4); animation: pop .25s; }
.modal h2 { margin: 0 0 8px; font-size: 22px; }
.modal p { font-weight: 600; line-height: 1.45; }
.modal .mbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.modal textarea { width: 100%; height: 90px; font-family: monospace; font-size: 11px; border-radius: 10px; border: 2px solid #e2d3b6; padding: 6px; user-select: text; }
.modal.pitchModal .mbtns, .modal.choice .mbtns { flex-direction: column; align-items: stretch; }

.speech { display: flex; gap: 14px; align-items: flex-start; }
.speech .bubble { background: #fff; border-radius: 18px; padding: 12px 14px; position: relative; font-weight: 700; line-height: 1.45; flex: 1; box-shadow: var(--shadow-s); }
.speech .bubble::before { content: ""; position: absolute; left: -10px; top: 26px; border: 10px solid transparent; border-right-color: #fff; border-left: 0; }
.rp-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; }
.rp-box { background: var(--card); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow-s); }
.rp-box h3 { margin: 0 0 6px; font-size: 15px; }
.rp-box ol { margin: 4px 0; padding-left: 22px; font-weight: 700; font-size: 13px; }
.mvp { display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, #fff1c4, #ffd56a); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow-s); margin-bottom: 12px; }
.mvp .trophy { font-size: 40px; animation: pulse 1.2s infinite; }
.mvp h3 { margin: 0; font-size: 19px; }
.mvp p { margin: 2px 0 0; font-size: 13px; }
.lvlup { color: var(--purple); font-weight: 900; }
.up { color: var(--green2); font-weight: 900; }
.down { color: var(--red); font-weight: 900; }
#toasts { position: fixed; right: calc(var(--panel-w) + 22px); bottom: 122px; z-index: 40; display: flex; flex-direction: column-reverse; gap: 8px; width: 330px; pointer-events: none; }
.toast { pointer-events: none; background: var(--card); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow); border-left: 7px solid var(--gold); animation: slideIn .3s; font-weight: 700; font-size: 13px; }
.toast b { display: block; font-size: 15px; margin-bottom: 2px; }
.toast.good { border-left-color: var(--green); }
.toast.bad { border-left-color: var(--red); }
.toast button { margin-top: 6px; font-size: 12px; pointer-events: auto; }
.toast.out { animation: slideOut .35s forwards; }
#tooltip { position: fixed; z-index: 90; pointer-events: none; display: none; max-width: 300px; background: #2b1838; color: #fff; padding: 8px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: pre-line; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
#tooltip b { color: var(--gold); }

/* =========================================================================
   TUTORIAL (låst spotlight)
   ========================================================================= */
.tutPanel { position: fixed; z-index: 80; background: rgba(12, 5, 18, .74); display: none; }
#tutRing { position: fixed; z-index: 81; border: 4px solid var(--gold); border-radius: 14px; pointer-events: none; display: none; animation: ring 1s infinite alternate; }
#tutArrow { position: fixed; z-index: 82; font-size: 38px; pointer-events: none; display: none; filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
#tutBubble { position: fixed; z-index: 83; display: none; width: 430px; }
#tutBubble .tb { display: flex; gap: 12px; align-items: flex-start; background: var(--cream); border-radius: 20px; padding: 12px 14px; box-shadow: 0 8px 0 rgba(0,0,0,.25), 0 16px 40px rgba(0,0,0,.4); }
#tutBubble .tb .pp { display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 900; font-size: 12px; }
#tutBubble .tb .pp .pt { width: 62px; height: 62px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; box-shadow: var(--shadow-s); }
#tutBubble .tb .tx { flex: 1; font-weight: 700; line-height: 1.45; font-size: 14px; }
#tutBubble .tb .tx .hint { display: block; margin-top: 6px; font-size: 12px; color: var(--orange2); font-weight: 900; }
#tutBubble .tb button { margin-top: 8px; }
.luckSign { display: inline-block; margin-top: 8px; background: linear-gradient(#ffd77e, var(--gold)); border: 3px solid #7a4a1a; border-radius: 10px; padding: 6px 16px; font-size: 20px; font-weight: 900; color: #5a2a00; transform: rotate(-3deg); box-shadow: var(--shadow-s); }

/* =========================================================================
   ANIMATIONER
   ========================================================================= */
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideOut { to { transform: translateX(40px); opacity: 0; } }
@keyframes floatUp { 0% { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -8px) scale(1.1); } 100% { transform: translate(-50%, -52px) scale(1); opacity: 0; } }
@keyframes bub { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -8px); } }
@keyframes knock { 0%,100% { transform: none; } 50% { transform: translateX(1.5px); } }
@keyframes legA { from { transform: translateY(0); } to { transform: translateY(-3px); } }
@keyframes legB { from { transform: translateY(-3px); } to { transform: translateY(0); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 50% { transform: translateX(2px); } }
@keyframes coin { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }
@keyframes flicker { 0%,100% { opacity: 1; } 40% { opacity: .75; } 70% { opacity: .9; } }
@keyframes count { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-18deg); } }
@keyframes blink { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.12); } }
@keyframes tap { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
@keyframes ring { from { box-shadow: 0 0 0 4px rgba(255,201,74,.35), 0 0 14px var(--gold); } to { box-shadow: 0 0 0 9px rgba(255,201,74,.15), 0 0 30px var(--gold); } }
.flick { animation: flicker 1.6s infinite; }
.counting { animation: count .35s infinite; transform-origin: 4px 2px; transform-box: fill-box; }
</style>
</head>

/* ---- Svensk talformatering: 1 234 kr, 12,3 tn, 3,4 mn, 5,6 md ---- */
// tn = tusen, mn = miljoner, md = miljarder, bn = biljoner, bd = biljarder, tr = triljoner
const UNITS = [[1e21, 'trd'], [1e18, 'tr'], [1e15, 'bd'], [1e12, 'bn'], [1e9, 'md'], [1e6, 'mn'], [1e3, 'tn']];
function group(n) { return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const neg = n < 0; n = Math.abs(n); let s;
  if (n < 1e4) s = group(n);
  else if (n >= 1e24) s = n.toExponential(2).replace('.', ',');
  else { const u = UNITS.find(u => n >= u[0]); const v = n / u[0]; s = String(v >= 100 ? Math.floor(v) : (Math.floor(v * 10) / 10).toFixed(1).replace(/\.0$/, '')).replace('.', ',') + ' ' + u[1]; }
  return (neg ? '−' : '') + s;
}
const kr = n => fmt(n) + ' kr';
function krExact(n) { if (Math.abs(n) < 1e4) return n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' kr'; return kr(n); }
const pctStr = (p, d = 0) => (p * 100).toFixed(d).replace('.', ',') + ' %';
const pp = p => Math.round(p * 100);

function starValue(p) { const v = Math.round(p * 100); if (v >= 46) return 6; if (v >= 39) return 5; if (v >= 31) return 4; if (v >= 24) return 3; if (v >= 17) return 2; if (v >= 10) return 1; return 0.5; }
function starsHTML(cur, pot) {
  const c = starValue(cur), p = pot != null ? Math.min(5, starValue(pot)) : 0, gold = c === 6;
  const cc = Math.min(5, c); let h = '';
  for (let i = 1; i <= 5; i++) {

function priceMult() { let m = 1; if (effect('jul')) m *= 2; if (effect('slut')) m *= 0.5; return m; }
const salePrice = (i, p = S.product) => CONFIG.products[p].price * buyPower(i) * priceMult();
const onStreet = s => (s.seated || s.temp) && !s.stoppedToday && !s.evictedToday;
const sellerActive = s => onStreet(s) && !(s.evictedUntil > S.time) && !(s.pausedUntil > S.time);

/* =========================================================================
   EKONOMI – fördelningen räknas vid varje försäljning
   ========================================================================= */
function splitSale(price, seller) {
  const E = CONFIG.economy;
  const commission = price * (seller.team === 'A' ? E.commissionA : E.commissionB);
  const basis = (price - commission) * (1 - E.costBasis);
  let maxiOwn = 0, maxiOther = 0;
  if (S.maxi.active) { if (seller.maxi) maxiOwn = basis * E.maxiOwn; else maxiOther = basis * E.maxiOther; }
  const coach = S.coach.hired ? price * E.coach : 0;
  let recruit = 0, recruiter = null;
  if (seller.recruitedBy != null && seller.recruitUntilDay > S.day) { recruiter = sellerById(seller.recruitedBy); if (recruiter) recruit = price * E.recruitBonus; }
  const profit = price - commission - maxiOwn - maxiOther - coach - recruit;
  return { commission, maxiOwn, maxiOther, coach, recruit, recruiter, profit };
}
function addToReports(fn) { for (const r of [S.report.today, S.report.week, S.report.all]) fn(r); }
// En försäljning av n klasar av produkt p
function saleChunk(s, i, p, n, pm) {
  const price = CONFIG.products[p].price * buyPower(i) * priceMult() * pm * n;
  const sp = splitSale(price, s);
  S.areas[i].bag += sp.profit;
  addToReports(r => { r.gross += price; r.commission += sp.commission; r.maxiOwn += sp.maxiOwn; r.maxiOther += sp.maxiOther; r.coach += sp.coach; r.recruit += sp.recruit; r.profit += sp.profit; r.clusters += n; });
  if (sp.recruiter) sp.recruiter.today.bonus += sp.recruit;
  s.today.sold += n; s.today.revenue += price; s.today.commission += sp.commission;
  s.total.sold += n; s.total.revenue += price;
  if (!SIM) VIS.onSale(s, i, sp.profit);
  return sp.profit;
}
// Säljer qty klasar ur säljarens väska (dyraste först). allowStock = får ta ur lagret hemma om väskan är tom.
function sellFrom(s, i, qty, o = {}) {
  let left = qty, gain = 0, sold = 0;
  const take = src => { for (let p = NP - 1; p >= 0 && left > 0; p--) { const n = Math.min(src[p], left); if (n <= 0) continue; src[p] -= n; left -= n; sold += n; gain += saleChunk(s, i, p, n, o.priceMult || 1); } };
  take(s.bag); if (o.allowStock && left > 0) take(S.stock);
  if (sold > 0) giveXP(s, sold * CONFIG.xp.perSale * (o.xpMult || 1));
  return { sold, gain };
}

/* ---- XP och nivåer ---- */
function giveXP(s, amount) {
  if (s.temp) return;
  if (s.team === 'B' && !isTrial(s)) amount *= 1 + coachXpBonus();
  s.xp += amount; s.today.xp += amount;
  while (s.lvl < CONFIG.xp.maxLevel && s.xp >= xpNeed(s.lvl)) {
    s.xp -= xpNeed(s.lvl); s.lvl++; s.today.levels++; S.stats.levelUps++;
    if (s.pct < s.pot) s.pct = Math.min(s.pot, s.pct + CONFIG.xp.pctPerLevel);
    if (!SIM) VIS.levelUp(s);
  }
  if (s.lvl >= CONFIG.xp.maxLevel) s.xp = Math.min(s.xp, xpNeed(s.lvl));
}

/* =========================================================================
   LAGER OCH VÄSKOR
   ========================================================================= */
function buyStock(p, n) {
  if (p > S.product) return 0;
  n = Math.min(Math.floor(n), storageCap() - stockTotal()); if (n <= 0) return 0;
  const cost = stockPrice(p, n);
  if (S.cash < cost) return 0;
  S.cash -= cost; S.stock[p] += n;
  addToReports(r => r.stockCost += cost);
  return n;
}
// största n ≤ cap som går att betala (rabatterna gör det icke-linjärt)
function maxAffordable(p, cap) {
  cap = Math.max(0, Math.floor(cap));
  let n = Math.min(cap, Math.floor(S.cash / (unitCost(p) * (1 - discountFor(cap)))));
  while (n > 0 && stockPrice(p, n) > S.cash) n--;
  return Math.max(0, n);
}
function fillStorage(p = S.product) { return buyStock(p, maxAffordable(p, storageCap() - stockTotal())); }
// Fyller en säljares väska från lagret, dyraste produkten först
function packBag(s) {
  let need = bagSize() - bagCount(s);
  for (let p = NP - 1; p >= 0 && need > 0; p--) { const n = Math.min(S.stock[p], need); if (n > 0) { S.stock[p] -= n; s.bag[p] += n; need -= n; } }
}
function returnBag(s) { for (let p = 0; p < NP; p++) { S.stock[p] += s.bag[p]; s.bag[p] = 0; } }
const sellersNeedingRefill = () => S.sellers.filter(s => onStreet(s) && bagCount(s) === 0);

/* =========================================================================
   BILPLATSER (väljs på morgonen)
   ========================================================================= */
function sellerOrder() { return [...S.sellers].filter(s => !s.temp).sort((a, b) => (a.team === 'A' ? 0 : 1) - (b.team === 'A' ? 0 : 1) || a.rank - b.rank || b.pct - a.pct); }
function bestAreaWithRoom(counts) { for (let i = S.areas.length - 1; i >= 0; i--) if (S.areas[i].unlocked && counts[i] < areaSeats(i)) return i; return -1; }
const seatedCount = () => S.sellers.filter(s => s.seated && !s.temp).length;
function areaCounts() { const c = S.areas.map(() => 0); for (const s of S.sellers) if (s.seated && !s.temp) c[s.area]++; return c; }
// Auto-fyll: A-laget först (bäst ranking först), sedan B-laget
function autoFill() {
  for (const s of S.sellers) if (!s.temp) s.seated = false;
  const counts = S.areas.map(() => 0); let used = 0;
  for (const s of sellerOrder()) {
    if (used >= carSeats()) break;
    if (!S.areas[s.area] || !S.areas[s.area].unlocked) s.area = 0;
    if (counts[s.area] >= areaSeats(s.area)) { const alt = bestAreaWithRoom(counts); if (alt < 0) continue; s.area = alt; }
    s.seated = true; counts[s.area]++; used++;
  }
}
// De bästa säljarna till områdena med högst köpkraft
function autoDistribute() {
  const seated = S.sellers.filter(s => s.seated && !s.temp).sort((a, b) => b.pct - a.pct);
  const counts = S.areas.map(() => 0);
  for (const s of seated) { const i = bestAreaWithRoom(counts); if (i >= 0) { s.area = i; counts[i]++; } }
}
function toggleSeat(s) {
  if (S.phase !== 'morning') return 'Bilplatser väljs på morgonen.';
  if (s.seated) { s.seated = false; return null; }
  if (seatedCount() >= carSeats()) return 'Bilen är full. Ta bort någon först eller köp en större bil.';
  const counts = areaCounts();
  if (counts[s.area] >= areaSeats(s.area)) { const alt = bestAreaWithRoom(counts); if (alt < 0) return 'Alla områden är fulla.'; s.area = alt; }
  s.seated = true; return null;
}
function setSellerArea(s, i) {
  if (!S.areas[i] || !S.areas[i].unlocked) return 'Området är inte upplåst.';
  if (S.phase !== 'morning') return 'Områden väljs på morgonen.';
  if (s.seated && s.area !== i && areaCounts()[i] >= areaSeats(i)) return `${areaName(i)} är fullt (${areaSeats(i)} platser). Uppgradera området för fler platser.`;
  s.area = i; return null;
}
const areaWorkers = i => S.sellers.filter(s => onStreet(s) && s.area === i);

/* =========================================================================
   DAGENS FASER: morgon → dag → hemkörning → rapport
   ========================================================================= */
function dayLabel() { return `Dag ${S.day} – ${CONFIG.day.names[S.weekday]}, vecka ${S.week}`; }
function clockStr() {
  const t = S.phase === 'morning' ? 0 : S.phase === 'day' ? S.dayClock : CONFIG.day.length;
  const mins = CONFIG.day.startHour * 60 + (CONFIG.day.endHour - CONFIG.day.startHour) * 60 * clamp(t / CONFIG.day.length, 0, 1);
  return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(Math.floor(mins % 60)).padStart(2, '0');
}
function morningCheck() {
  const n = seatedCount(), need = n * bagSize(), have = stockTotal(), warns = [];
  if (n === 0) warns.push('Ingen säljare åker med. Kryssa i säljare eller tryck Auto-fyll.');
  else if (have < need) warns.push(`Lagret räcker bara till ${Math.floor(have / bagSize())} av ${n} säljare (${fmt(have)} av ${fmt(need)} klasar).`);
  if (n > 0 && n < carSeats() && S.sellers.filter(s => !s.temp).length > n) warns.push(`${carSeats() - n} lediga platser i bilen.`);
  return { n, need, have, warns };
}
function spacedTimes(n, a, b, gap) { const t = []; let tries = 0; while (t.length < n && tries++ < 300) { const x = rand(a, b); if (t.every(y => Math.abs(y - x) >= gap)) t.push(x); } return t.sort((x, y) => x - y); }
function startDay() {
  if (S.phase !== 'morning' || seatedCount() === 0) return false;
  S.phase = 'day'; S.dayClock = 0; S.closeT = 0;
  S.car = { ...S.car, pos: 0, target: 0, phase: 'idle', timer: 0, load: 0 };
  const order = S.sellers.filter(s => s.seated).sort((a, b) => (a.team === 'A' ? 0 : 1) - (b.team === 'A' ? 0 : 1) || a.rank - b.rank);
  for (const s of order) { s.acc = Math.random(); packBag(s); }
  // Schemalägg dagens händelser (inga under grundtutorialens första dag)
  const tutorialDay = !SIM && !S.tut.done.basic;
  const nR = tutorialDay ? 0 : randInt(0, CONFIG.day.randomEventsMax);
  const nC = tutorialDay ? 0 : randInt(CONFIG.day.choiceEvents[0], CONFIG.day.choiceEvents[1]);
  S.plan = { rnd: Array.from({ length: nR }, () => rand(40, 270)).sort((a, b) => a - b), choice: spacedTimes(nC, 35, 280, 45) };
  if (!SIM) UI.onPhase();
  return true;
}
function startClosing() {
  S.phase = 'closing'; S.closeT = 0;
  S.effects = S.effects.filter(e => e.type !== 'punka' && e.type !== 'ica');
  S.pitch = null;
  if (!SIM) { UI.toast('Klockan är 18:00!', 'Arvin kör runt och hämtar hem alla säljare och pengar.', ''); UI.onPhase(); }
}
function endDay() {
  // Allt som är kvar ute räknas in – inga pengar går förlorade
  let rest = S.car.load + S.kassa.buffer; S.car.load = 0; S.kassa.buffer = 0;
  for (const a of S.areas) { rest += a.bag; a.bag = 0; }
  if (rest > 0) cashIn(rest);
  S.car = { ...S.car, pos: 0, target: 0, phase: 'idle', timer: 0 };
  for (const s of S.sellers) returnBag(s);                 // osålda klasar tillbaka till lagret
  const temps = S.sellers.filter(s => s.temp);             // Maxis testkille → blir kandidat
  for (const t of temps) S.candidates.push({ name: t.name, pct: t.pct, pot: t.pot, cost: hireCostFor(t.pot), via: { type: 'maxi' }, testkille: true });
  S.sellers = S.sellers.filter(s => !s.temp);
  for (const s of S.sellers) for (const k in s.today) s.week[k] = (s.week[k] || 0) + s.today[k];
  const list = S.sellers.filter(s => s.today.worked > 0 || s.today.sold > 0).map(s => ({ id: s.id, name: s.name, maxi: s.maxi, team: s.team, lvl: s.lvl, ...s.today }))
    .concat(temps.map(t => ({ id: t.id, name: t.name + ' (test)', maxi: true, team: 'B', lvl: 1, ...t.today })))
    .sort((a, b) => b.sold - a.sold || b.opened - a.opened);
  S.lastDay = { day: S.day, weekday: S.weekday, week: S.week, report: { ...S.report.today }, sellers: list, mvpTitle: pick(CONFIG.mvpTitles) };
  S.effects = []; S.pitch = null;
  for (const k of ['pep', 'gas', 'gold']) S.abilities[k].until = -1;
  S.boost = { car: 0, kassa: 0, area: new Array(8).fill(0) };
  S.phase = 'report';
  if (!SIM) { UI.onPhase(); UI.dailyReport(); save(); }
}
// Efter dagsrapporten. Efter fredag: veckoslut och veckorapport först.
function finishReport() {
  if (S.phase !== 'report') return;
  if (S.weekday === 4 && !S.weekDone) { S.weekDone = true; const info = weekEnd(); if (!SIM) { UI.weeklyReport(info); return; } }
  nextDay();
}
function nextDay() {
  if (S.phase !== 'report') return;
  S.weekDone = false;
  S.day++; S.weekday = (S.weekday + 1) % 5; if (S.weekday === 0) S.week++;
  S.phase = 'morning'; S.dayClock = 0;
  S.report.today = emptyReport();
  for (const s of S.sellers) { s.today = emptyToday(); s.stoppedToday = false; s.evictedToday = false; s.pausedUntil = 0; s.evictedUntil = 0; s.dayMult = 1; }
  for (const k in S.abilities) S.abilities[k].used = 0;
  // Behåll gårdagens plan, men se till att den fortfarande är giltig
  let used = 0; const counts = S.areas.map(() => 0);
  for (const s of sellerOrder()) { if (!s.seated) continue; if (used >= carSeats() || counts[s.area] >= areaSeats(s.area)) { s.seated = false; continue; } used++; counts[s.area]++; }
  if (!SIM) { UI.onPhase(); UI.setTab('morgon'); save(); }
}
function update(dt) {
  if (S.phase !== 'day' && S.phase !== 'closing') return;
  S.time += dt;
  for (const k of ['car', 'kassa']) if (S.boost[k] > 0) S.boost[k] = Math.max(0, S.boost[k] - dt);
  for (let i = 0; i < 8; i++) if (S.boost.area[i] > 0) S.boost.area[i] = Math.max(0, S.boost.area[i] - dt);
  if (S.effects.length) S.effects = S.effects.filter(e => e.until > S.time);
  if (S.phase === 'day') {
    S.dayClock += dt;
    while (S.plan.rnd.length && S.dayClock >= S.plan.rnd[0]) { S.plan.rnd.shift(); triggerRandomEvent(); }
    if (S.plan.choice.length && S.dayClock >= S.plan.choice[0]) { S.plan.choice.shift(); triggerChoiceEvent(); }
    if (S.pitch && !S.pitch.open && S.time >= S.pitch.until) pitchTimeout();
    updateSellers(dt);
    if (S.dayClock >= CONFIG.day.length) startClosing();
  } else S.closeT += dt;
  updateCar(dt);
  updateKassa(dt);
  sampleIncome(dt);
  checkCompletion();
  if (S.phase === 'closing') {
    const done = S.areas.every(a => a.bag < 0.5) && S.car.phase === 'idle' && S.car.pos === 0 && S.car.load < 0.5 && S.kassa.buffer < 0.5;
    if (done || S.closeT > CONFIG.day.closingMax) endDay();
  }
}

/* ---- Säljarna knackar dörr ---- */
function updateSellers(dt) {
  const rate = [], open = [], full = [];
  for (const i of unlockedAreas()) { rate[i] = knockRate(i); open[i] = openChance(i); full[i] = S.areas[i].bag >= bagCap(i); }
  for (const s of S.sellers) {
    if (!sellerActive(s)) continue;
    const i = s.area; if (!S.areas[i].unlocked) continue;
    if (full[i]) continue;
    const left = bagCount(s); if (left <= 0) continue;
    s.today.worked += dt; s.total.worked += dt;
    s.acc += rate[i] * dt;
    const k = Math.floor(s.acc); if (k <= 0) continue;
    s.acc -= k;
    const p = salePct(s, i), o = open[i];
    let opened = 0, sales = 0;
    if (k <= 80) { for (let j = 0; j < k; j++) if (Math.random() < o) { opened++; if (Math.random() < p) sales++; } }
    else { const q = o * p, mean = k * q; sales = Math.max(0, Math.round(mean + gauss() * Math.sqrt(mean * (1 - q)))); opened = Math.round(k * o); }
    // Pitch-chans: en av de öppnade dörrarna blir en pitch i stället
    if (opened > 0 && !SIM && maybeStartPitch(s, i, opened)) { if (sales > 0 && Math.random() < sales / opened) sales--; }
    sales = Math.min(sales, left);
    s.today.knocks += k; s.today.opened += opened; s.total.knocks += k; s.total.opened += opened;
    addToReports(r => { r.knocks += k; r.opened += opened; });
    if (opened > 0) giveXP(s, opened * CONFIG.xp.perOpen);
    if (sales > 0) { sellFrom(s, i, sales); if (S.areas[i].bag >= bagCap(i)) full[i] = true; }
    if (!SIM) VIS.outcome(s, sales > 0 ? 'sale' : opened > 0 ? 'no' : 'closed');
  }
}

/* ---- Bilen: hämtar pengar och fyller på väskor ---- */
function needsStop(i) {
  const a = S.areas[i]; if (!a.unlocked) return false;
  if (a.bag > 0.5) return true;
  return S.phase === 'day' && stockTotal() > 0 && S.sellers.some(s => onStreet(s) && s.area === i && bagCount(s) === 0);
}
function nextStop(after) { for (let i = after + 1; i < S.areas.length; i++) if (needsStop(i)) return i; return -1; }
function updateCar(dt) {
  const c = S.car;
  if (effect('punka') || effect('ica')) return;
  let guard = 0;
  while (dt > 1e-6 && guard++ < 40) {
    if (c.phase === 'idle') {
      const nx = nextStop(-1); if (nx < 0) return;
      c.target = nx + 1; c.phase = 'move';
    } else if (c.phase === 'move') {
      const sp = carSpeed(), dist = Math.abs(c.target - c.pos), step = sp * dt;
      if (step >= dist) { dt -= dist / sp; c.pos = c.target; c.timer = CONFIG.car.stopTime; c.phase = c.target === 0 ? 'unload' : 'load'; }
      else { c.pos += Math.sign(c.target - c.pos) * step; dt = 0; }
    } else {
      const t = Math.min(dt, c.timer); c.timer -= t; dt -= t;
      if (c.timer > 1e-6) continue;
      if (c.phase === 'load') {
        const i = Math.round(c.pos) - 1, a = S.areas[i];
        if (S.phase === 'day') for (const s of S.sellers) if (onStreet(s) && s.area === i && bagCount(s) < bagSize()) packBag(s);
        const take = Math.min(a.bag, carCap() - c.load); a.bag -= take; c.load += take;
        const nx = c.load < carCap() - 0.5 ? nextStop(i) : -1;
        c.target = nx >= 0 ? nx + 1 : 0; c.phase = 'move';
      } else {
        S.kassa.buffer += c.load; if (!SIM && c.load > 0) VIS.unload(c.load);
        c.load = 0; c.phase = 'idle';
      }
    }
  }
}
function updateKassa(dt) { const k = S.kassa; if (k.buffer <= 0) return; const amt = Math.min(k.buffer, kassaRate() * dt); k.buffer -= amt; cashIn(amt); }
// Rykte = permanent inkomstmultiplikator, läggs på när pengarna räknas in
function cashIn(amt) {
  const bonus = amt * (rykteMult() - 1);
  addToReports(r => r.rykteBonus += bonus);
  const a = amt + bonus; S.cash += a; S.cityEarned += a; S.totalEarned += a; S.sampleAcc += a;
}
function sampleIncome(dt) {
  S.sampleSum += dt;
  if (S.sampleSum >= 1) {
    S.incomeSamples.push(S.sampleAcc / S.sampleSum); S.sampleAcc = 0; S.sampleSum = 0;
    if (S.incomeSamples.length > 20) S.incomeSamples.shift();
    S.incomeRate = sum(S.incomeSamples) / S.incomeSamples.length;
  }
}

/* =========================================================================
   VECKOSLUT (efter fredagen): ranking, coach, nya kandidater
   ========================================================================= */
const perMin = s => s.week.worked > 0 ? s.week.sold / (s.week.worked / 60) : 0;
function weekEnd() {
  const W = CONFIG.week, before = new Map(S.sellers.map(s => [s.id, s.team]));
  const potUps = [];
  if (S.coach.hired && S.coach.potTraining) for (const s of S.sellers) if (s.team === 'B' && !s.potBoosted && s.pot < CONFIG.coach.potMax) { s.pot = Math.min(CONFIG.coach.potMax, s.pot + CONFIG.coach.potBoost); s.potBoosted = true; potUps.push(s.name); }
  // Ranking efter klasar per arbetad minut (den som inte jobbat behåller sin plats). Provveckan räknas i arbetsdagar.
  const trial = S.sellers.filter(s => s.trialUntilDay > S.day + 1);
  const rest = S.sellers.filter(s => !(s.trialUntilDay > S.day + 1));
  const idle = rest.filter(s => s.week.worked < 5);
  const workers = rest.filter(s => s.week.worked >= 5).sort((a, b) => perMin(b) - perMin(a) || b.pct - a.pct);
  const slots = Math.max(0, W.aTeamSize - idle.filter(s => s.team === 'A').length);
  const ranking = workers.map(s => ({ id: s.id, name: s.name, maxi: s.maxi, rate: perMin(s), sold: s.week.sold }));
  workers.forEach((s, i) => { s.team = i < slots ? 'A' : 'B'; });
  for (const s of trial) s.team = 'A';
  const order = [...S.sellers].sort((a, b) => (a.team === 'A' ? 0 : 1) - (b.team === 'A' ? 0 : 1) || (b.week.worked >= 5 ? perMin(b) : -1) - (a.week.worked >= 5 ? perMin(a) : -1) || a.rank - b.rank);
  order.forEach((s, i) => s.rank = i);
  const info = {
    week: S.week, report: { ...S.report.week }, ranking, potUps,
    up: S.sellers.filter(s => before.get(s.id) === 'B' && s.team === 'A').map(s => s.name),
    down: S.sellers.filter(s => before.get(s.id) === 'A' && s.team === 'B').map(s => s.name),
    trial: trial.map(s => s.name),
    sellers: S.sellers.map(s => ({ id: s.id, name: s.name, maxi: s.maxi, team: s.team, lvl: s.lvl, ...s.week })).sort((a, b) => b.sold - a.sold),
    A: order.filter(s => s.team === 'A').map(s => s.name), B: order.filter(s => s.team === 'B').map(s => s.name),
  };
  S.report.lastWeek = { ...S.report.week, week: S.week };
  S.report.week = emptyReport();
  for (const s of S.sellers) s.week = emptyToday();
  S.lastWeekInfo = info;
  newCandidates(false);
  return info;
}

/* =========================================================================
   REKRYTERING, SPARKA
   ========================================================================= */
function nextName() {
  const pool = CONFIG.candidateNames, minUse = Math.min(...pool.map(n => S.nameUses[n] || 0));
  const name = pick(pool.filter(n => (S.nameUses[n] || 0) === minUse));
  S.nameUses[name] = (S.nameUses[name] || 0) + 1;
  return S.nameUses[name] > 1 ? `${name} ${S.nameUses[name]}` : name;
}
function hireCostFor(pot) { const h = CONFIG.hireCost; return Math.round((h.base + S.incomeRate * h.incomeSeconds) * Math.pow(pot / 0.30, h.exponent) / 10) * 10; }

let choiceOpen = false;

function deepMerge(base, obj) {

  const out = { ...base };
  for (const k in obj) out[k] = (base && typeof base[k] === 'object' && base[k] && !Array.isArray(base[k])) ? deepMerge(base[k], obj[k]) : obj[k];
  return out;
}

function migrateV1(d) {

    s.pot = Math.min(0.45, s.pct + rand(0.05, 0.15)); if (s.pot < s.pct) s.pot = s.pct;
    s.lvl = 1; s.xp = 0; s.seated = false; s.bag = new Array(NP).fill(0);

  if (best > 0) d.tut.done.product = true;

  if (d.areas) for (const a of d.areas) { d.cash = (d.cash || 0) + (a.bag || 0); a.bag = 0; }

  if (data.v !== 2) throw new Error('Okänd version');
  const prev = S; newGame(); const fresh = S; S = prev;
  const merged = deepMerge(fresh, data);
  merged.areas = CONFIG.area.unlockCost.map((c, i) => ({ ...newAreas()[i], ...(data.areas && data.areas[i]) }));
  const shape = makeSellerShape();
  for (const s of merged.sellers) { for (const k in shape) if (s[k] === undefined) s[k] = JSON.parse(JSON.stringify(shape[k])); if (!Array.isArray(s.bag) || s.bag.length !== NP) s.bag = new Array(NP).fill(0); }

function countUp(root) {
  const els = [...root.querySelectorAll('[data-count]')]; const t0 = performance.now();
  const step = now => { const f = Math.min(1, (now - t0) / 1100), e = 1 - Math.pow(1 - f, 3);
    for (const el of els) { const v = +el.dataset.count * e; el.textContent = el.dataset.k === 'kr' ? kr(v) : fmt(Math.round(v)); }
    if (f < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

      <div class="upRow"><div class="tx">Mer XP till B-laget<small>${xpMax ? 'Max (+150 %)' : `+${Math.round(coachXpBonus() * 100)} % → +${Math.round((coachXpBonus() + cfg.xpStep) * 100)} %`}</small></div><button class="buy ${!xpMax && S.cash >= coachXpCost() ? 'can' : ''}" data-act="coachUp" data-arg="xp" ${xpMax ? 'disabled' : ''}>${xpMax ? 'Max' : kr(coachXpCost())}</button></div>
      <div class="upRow"><div class="tx">Potentialträning<small>${C.potTraining ? 'Aktiv: B-lagare får +5 potential (en gång var) vid veckoslut' : xpMax ? '+5 potential en gång per B-lagare (max 60 %)' : 'Kräver max XP-nivå först'}</small></div><button class="buy ${!C.potTraining && xpMax && S.cash >= cfg.potCost ? 'can' : ''}" data-act="coachUp" data-arg="pot" ${C.potTraining || !xpMax ? 'disabled' : ''}>${C.potTraining ? '✓' : kr(cfg.potCost)}</button></div></div>`;

  rapport() {

      <tr><td>Coachens andel</td><td>−${kr(r.coach)}</td></tr><tr><td>Värvningsbonusar</td><td>−${kr(r.recruit)}</td></tr><tr><td>Lagerinköp</td><td>−${kr(r.stockCost)}</td></tr>

    if (S.report.lastWeek) h += `<div class="sec">${row(S.report.lastWeek, 'Förra veckan (v. ' + S.report.lastWeek.week + ')')}</div>`;

    h += `<div class="sec"><h3>Mål ${S.completed ? '<span class="badge seat">Klart!</span>' : ''}</h3>${gp.map(([t, ok]) => `<p>${ok ? '✅' : '⬜'} ${esc(t)}</p>`).join('')}

    const gain = prestigeGain(), ok = canPrestige() && S.phase !== 'day' && S.phase !== 'closing', nc = CONFIG.cities[nextCityIdx()];
    h += `<div class="sec" id="prestigeSec"><h3>Ny stad 🏙️</h3><p>Intjänat i ${esc(city().name)}: <b>${kr(S.cityEarned)}</b> (krävs ${kr(CONFIG.prestige.minEarned)})</p>

    const A = S.report.all;
    return h + `<div class="sec"><h3>Statistik</h3><table class="rep"><tr><td>Totalt intjänat</td><td>${kr(S.totalEarned)}</td></tr><tr><td>Sålda klasar totalt</td><td>${fmt(A.clusters)}</td></tr>
      <tr><td>Knackade / öppnade dörrar</td><td>${fmt(A.knocks)} / ${fmt(A.opened)}</td></tr><tr><td>Total försäljning</td><td>${kr(A.gross)}</td></tr><tr><td>Total provision</td><td>${kr(A.commission)}</td></tr>
      <tr><td>Lagerinköp totalt</td><td>${kr(A.stockCost)}</td></tr><tr><td>Anställda / sparkade</td><td>${S.stats.hired} / ${S.stats.fired}</td></tr><tr><td>Pitchar / val-events</td><td>${S.stats.pitches} / ${S.stats.choices}</td></tr>
      <tr><td>Level-ups</td><td>${S.stats.levelUps}</td></tr><tr><td>Städer expanderade</td><td>${S.stats.prestiges}</td></tr></table></div>`;
  },
};
function abilityUpgradesHTML(who) {
  let h = `<div class="sec"><h3>${who === 'soran' ? 'Sorans' : 'Arvins'} förmågor</h3>`;
  for (const k in CONFIG.abilities) {
    const c = CONFIG.abilities[k]; if (c.who !== who) continue;
    const st = S.abilities[k], max = st.lvl >= c.maxLevel, cost = abilityUpCost(k), nl = st.lvl + 1, nUses = 1 + (nl >= 2 ? 1 : 0) + (nl >= 4 ? 1 : 0);
    const nx = max ? 'Max' : `${c.duration ? `Tid ${abilityDuration(k)} s → ${abilityDuration(k) + c.durStep} s · ` : ''}${abilityUses(k)} → ${nUses} gånger/dag`;
    h += `<div class="upRow"><div class="tx">${c.name} nivå ${st.lvl}<small>${nx}</small></div><button class="buy ${!max && S.cash >= cost ? 'can' : ''}" data-act="abUp" data-arg="${k}" ${max ? 'disabled' : ''}>${max ? 'Max' : kr(cost)}</button></div>`;
  }
  return h + '</div>';
}

      () => { const gg = doPrestige(); UI.buildScene(); UI.onPhase(); UI.setTab('morgon'); UI.toast(`Välkommen till ${esc(city().name)}!`, `+★ ${gg} Rykte. Vi börjar om i ${esc(areaName(0))}.`, 'good'); save(); }, 'Expandera!', 'orange');

       { label: 'Stäng', cls: '' }],
      { onOpen: L => { const b = L.querySelector('#expBox'); b.value = exportSave(); b.onclick = () => b.select(); } });
  },
};

// När visas upplåsningstutorials? (bara när grundtutorialen är klar)
const TUT_TRIGGERS = [
  ['weekly', () => !!document.querySelector('.weekReport')],
  ['area', () => { const n = S.areas.findIndex(a => !a.unlocked); return n > 0 && S.cash >= CONFIG.area.unlockCost[n] && S.phase !== 'report' && !modalOpen; }],
  ['cands', () => S.phase === 'morning' && S.week >= 2 && S.weekday === 0 && !modalOpen],
  ['maxi', () => S.day >= 2 && S.maxi.active && S.phase === 'morning' && !modalOpen],
  ['coach', () => S.areas[1].unlocked && !modalOpen && S.phase !== 'report'],
  ['product', () => S.product + 1 < NP && S.cash >= CONFIG.products[S.product + 1].cost && !modalOpen && S.phase !== 'report'],
  ['storage', () => S.phase === 'morning' && !modalOpen && seatedCount() * bagSize() > storageCap()],
  ['car', () => S.car.tier + 1 < CONFIG.car.ladder.length && S.cash >= CONFIG.car.ladder[S.car.tier + 1].cost && !modalOpen && S.phase !== 'report'],
  ['abSoran', () => S.phase === 'day' && S.day >= 2 && !modalOpen],
  ['abArvin', () => S.phase === 'day' && S.day >= 2 && !modalOpen && S.tut.done.abSoran],
  ['levelup', () => S.stats.levelUps > 0 && S.phase === 'day' && !modalOpen],
  ['prestige', () => canPrestige() && S.phase !== 'day' && S.phase !== 'closing' && !modalOpen],
];
function tutResolveTarget(st) { if (!st.target) return null; return typeof st.target === 'function' ? st.target() : document.querySelector(st.target); }
function tutStart(key) { TUT.seq = key; TUT.idx = 0; TUT.showing = false; TUT.shownOnce = false; S.tut.cur = { key, idx: 0 }; const st = TUT_SEQ[key][0]; if (st.onEnter) st.onEnter(); }
function tutAdvance() {
  const st = TUT_SEQ[TUT.seq][TUT.idx];
  tutHide();
  if (st.onDone) st.onDone();
  TUT.idx++; TUT.shownOnce = false;
  if (TUT.idx >= TUT_SEQ[TUT.seq].length) { S.tut.done[TUT.seq] = true; S.tut.cur = null; TUT.seq = null; save(); return; }
  S.tut.cur = { key: TUT.seq, idx: TUT.idx };
  const n = TUT_SEQ[TUT.seq][TUT.idx]; if (n.onEnter) n.onEnter();
}
function tutTick() {
  if (SIM) return;
  if (!TUT.seq) {
    if (!S.tut.done.basic) { if (S.phase === 'morning' && !modalOpen) tutStart('basic'); return; }
    for (const [key, cond] of TUT_TRIGGERS) if (!S.tut.done[key] && cond()) { tutStart(key); break; }
    if (!TUT.seq) return;
  }
  const st = TUT_SEQ[TUT.seq][TUT.idx];
  if (TUT.showing) { tutPosition(); return; }
  if (st.waitFor && !st.waitFor()) return;
  const inModal = st.target === '.modal' || String(st.target || '').startsWith('.rp') || st.target === '#btnNextDay';
  if (modalOpen && !inModal) return;
  if (st.onShow && !TUT.shownOnce) { TUT.shownOnce = true; st.onShow(); return; }   // låt DOM uppdateras en frame
  TUT.shownOnce = true;
  const el = tutResolveTarget(st);
  if (st.target && !el) { if (!TUT.missingSince) TUT.missingSince = performance.now(); if (performance.now() - TUT.missingSince < 2500) return; }
  TUT.missingSince = 0;
  tutShow(st, el);
}
function tutShow(st, el) {
  TUT.showing = true; TUT.target = el; TUT.step = st;
  TUT.mode = el ? (st.mode || 'click') : 'ok';
  if (el && el.closest('#scene')) el.scrollIntoView({ block: 'center' });
  if (el && el.closest('#tabBody')) el.scrollIntoView({ block: 'nearest' });
  const pic = w => `<div class="pp"><div class="pt">${portraitSVG(w)}</div>${w === 'soran' ? 'Soran' : 'Arvin'}</div>`;
  $('#tutBubble').innerHTML = `<div class="tb">${pic(st.who)}${st.both ? pic(st.who === 'soran' ? 'arvin' : 'soran') : ''}<div class="tx">${st.text}${TUT.mode === 'click' ? '<span class="hint">👆 Klicka på det som lyser</span>' : `<br><button class="orange" id="tutOk">Okej!</button>`}</div></div>`;
  for (const id of ['tutP1', 'tutP2', 'tutP3', 'tutP4', 'tutBubble']) $('#' + id).style.display = 'block';
  tutPosition();
}
function tutHide() { TUT.showing = false; TUT.target = null; for (const id of ['tutP1', 'tutP2', 'tutP3', 'tutP4', 'tutBubble', 'tutRing', 'tutArrow']) $('#' + id).style.display = 'none'; }
function tutPosition() {
  let el = TUT.target && document.contains(TUT.target) ? TUT.target : (TUT.step && TUT.step.target ? tutResolveTarget(TUT.step) : null);
  if (el) TUT.target = el;
  const W = innerWidth, H = innerHeight, pad = 6;
  let r = el ? el.getBoundingClientRect() : null; if (r && (r.width === 0 || r.height === 0)) r = null;
  const hole = r ? { x: Math.max(0, r.left - pad), y: Math.max(0, r.top - pad), w: r.width + pad * 2, h: r.height + pad * 2 } : { x: W / 2, y: H / 2, w: 0, h: 0 };
  for (const [id, x, y, w, h] of [['tutP1', 0, 0, W, hole.y], ['tutP2', 0, hole.y + hole.h, W, H - hole.y - hole.h], ['tutP3', 0, hole.y, hole.x, hole.h], ['tutP4', hole.x + hole.w, hole.y, W - hole.x - hole.w, hole.h]]) {
    const e = $('#' + id); e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.width = Math.max(0, w) + 'px'; e.style.height = Math.max(0, h) + 'px';
  }
  const ring = $('#tutRing'), arrow = $('#tutArrow'), bub = $('#tutBubble');
  if (r) {
    ring.style.display = 'block'; ring.style.left = hole.x + 'px'; ring.style.top = hole.y + 'px'; ring.style.width = hole.w + 'px'; ring.style.height = hole.h + 'px';
    const above = hole.y > 70, bounce = Math.sin(performance.now() / 160) * 6;
    arrow.style.display = 'block'; arrow.textContent = above ? '👇' : '👆';
    arrow.style.left = (hole.x + hole.w / 2 - 20) + 'px'; arrow.style.top = (above ? hole.y - 50 + bounce : hole.y + hole.h + 4 + bounce) + 'px';
  } else { ring.style.display = 'none'; arrow.style.display = 'none'; }
  const bw = 430, bh = bub.offsetHeight || 150; let bx, by;
  if (!r) { bx = W / 2 - bw / 2; by = H / 2 - bh / 2; }
  else {
    bx = clamp(hole.x + hole.w / 2 - bw / 2, 10, W - bw - 10);
    by = hole.y + hole.h + 56; if (by + bh > H - 10) by = hole.y - bh - 60;
    if (by < 10) { by = clamp(hole.y + hole.h / 2 - bh / 2, 10, H - bh - 10); bx = hole.x + hole.w + 20 + bw < W ? hole.x + hole.w + 20 : Math.max(10, hole.x - bw - 20); }
  }
  bub.style.left = bx + 'px'; bub.style.top = by + 'px';
}
// Blockera alla klick utanför spotlighten medan ett tutorialsteg visas
function tutGuard(e) {
  if (!TUT.showing) return;
  const ok = $('#tutOk');
  if (ok && (e.target === ok || ok.contains(e.target))) { if (e.type === 'click') { e.stopPropagation(); e.preventDefault(); tutAdvance(); } return; }
  if (TUT.mode === 'click' && TUT.target && TUT.target.contains(e.target)) { if (e.type === 'click') setTimeout(() => { if (TUT.showing) tutAdvance(); }, 0); return; }
  e.stopPropagation(); e.preventDefault();
}
for (const t of ['click', 'pointerdown', 'mousedown', 'pointerup', 'mouseup', 'change', 'input', 'keydown', 'dblclick', 'contextmenu']) window.addEventListener(t, tutGuard, true);

/* =========================================================================
   SPELLOOPEN (requestAnimationFrame + delta-tid)
   ========================================================================= */
let lastFrame = 0, panelTimer = 0, saveTimer = 0, spriteTimer = 0, phaseTimer = 0;
function frame(now) {
  let dt = lastFrame ? (now - lastFrame) / 1000 : 0; lastFrame = now;
  dt = Math.min(dt, 0.25);                     // stängd/dold flik = ingen offline-tid
  try {
    const run = !isPaused();
    if (run) update(dt);
    tutTick();
    spriteTimer += dt; if (spriteTimer > 0.2) { spriteTimer = 0; VIS.syncSprites(); }
    VIS.frame(run ? dt : 0);
    UI.updateScene(); UI.updateTop(); UI.updateManagers();
    panelTimer += dt; if (panelTimer > 0.25) { panelTimer = 0; UI.refreshPanel(); }
    phaseTimer += dt; if (phaseTimer > 0.3) { phaseTimer = 0; UI.onPhase(); }
    saveTimer += dt; if (saveTimer > CONFIG.autosaveSeconds) { saveTimer = 0; save(); }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

/* =========================================================================
   DEBUG/BALANS (bara för test): window.__ljusco
   ========================================================================= */
function botBuy(log) {
  for (let g = 0; g < 400; g++) {
    const opts = [], one = f => () => { const m = S.buyMode; S.buyMode = 1; f(); S.buyMode = m; };
    const nu = S.areas.findIndex(a => !a.unlocked);
    if (nu > 0) opts.push({ prio: 1, cost: CONFIG.area.unlockCost[nu], fn: () => unlockArea(nu), name: 'unlock ' + nu });
    if (S.product + 1 < NP) opts.push({ prio: 1, cost: CONFIG.products[S.product + 1].cost, fn: buyProduct, name: 'product ' + (S.product + 1) });
    if (S.car.tier + 1 < CONFIG.car.ladder.length) opts.push({ prio: 1, cost: CONFIG.car.ladder[S.car.tier + 1].cost, fn: buyCarTier, name: 'car ' + (S.car.tier + 1) });
    if (S.areas[1].unlocked && !S.coach.hired) opts.push({ prio: 1, cost: CONFIG.coach.hireCost, fn: hireCoach, name: 'coach' });
    S.areas.forEach((a, i) => { if (a.unlocked) opts.push({ cost: levelCost(CONFIG.area.upgradeBase[i], a.level), fn: one(() => upgradeArea(i)) }); });
    opts.push({ cost: levelCost(CONFIG.car.capCostBase, S.car.capLvl), fn: one(() => upgradeCar('cap')) });
    opts.push({ cost: levelCost(CONFIG.car.speedCostBase, S.car.speedLvl), fn: one(() => upgradeCar('speed')) });
    opts.push({ cost: levelCost(CONFIG.kassa.costBase, S.kassa.lvl), fn: one(upgradeKassa) });
    if (storageCap() < carSeats() * bagSize() * 2.2) opts.push({ cost: levelCost(CONFIG.stock.storage.costBase, S.storageLvl) * 0.8, fn: one(upgradeStorage) });
    if (S.sellers.some(x => x.today.sold + x.week.sold / 5 >= bagSize() * 0.9)) opts.push({ cost: levelCost(CONFIG.stock.bag.costBase, S.bagLvl), fn: one(upgradeBag) });
    if (S.maxi.pepLvl < CONFIG.maxi.pepLevels.length - 1) opts.push({ cost: maxiPepCost(), fn: upgradeMaxi });
    for (const k in CONFIG.abilities) if (S.abilities[k].lvl < CONFIG.abilities[k].maxLevel) opts.push({ cost: abilityUpCost(k), fn: () => upgradeAbility(k) });
    if (S.coach.hired && S.coach.xpLvl < CONFIG.coach.xpMaxLevel) opts.push({ cost: coachXpCost(), fn: () => upgradeCoach('xp') });
    const reserve = Math.min(S.cash * 0.5, carSeats() * bagSize() * 2 * unitCost(S.product));   // spara till lager
    const prio = opts.filter(o => o.prio).sort((a, b) => a.cost - b.cost);
    const big = prio.find(o => o.cost <= S.cash - reserve);
    if (big) { big.fn(); if (log) log(big.name); continue; }
    const small = opts.filter(o => !o.prio && o.cost <= S.cash - reserve).sort((a, b) => a.cost - b.cost)[0];
    if (!small) break;
    const goal = prio[0];
    if (goal && goal.cost <= S.cash + S.incomeRate * 200 && small.cost > S.cash - goal.cost) break;
    small.fn();
  }
}
function botStock() {
  const target = Math.min(storageCap(), seatedCount() * bagSize() * 2.2);
  if (stockTotal() < target) buyStock(S.product, maxAffordable(S.product, target - stockTotal()));
  if (stockTotal() < seatedCount() * bagSize()) for (let p = S.product - 1; p >= 0; p--) buyStock(p, maxAffordable(p, storageCap() - stockTotal()));
}
function botMorning(log) {
  while (S.sellers.length < carSeats() + 2 && S.candidates.length) {
    const i = S.candidates.map((c, i) => i).filter(i => S.candidates[i].cost <= S.cash * 0.25).sort((a, b) => S.candidates[b].pot - S.candidates[a].pot)[0];
    if (i === undefined) break; hire(i);
  }
  autoFill(); autoDistribute();
  botStock();
  botBuy(log);
  autoFill(); autoDistribute(); botStock();
}
function botDayTick(log) {
  for (const k of ['pep', 'gas']) if (abilityUsable(k)) useAbility(k);
  if (abilityUsable('gold')) useAbility('gold', unlockedCount() - 1);
  if (effect('punka')) fixFlat();
  if (stockTotal() < seatedCount() * bagSize() * 0.5) botStock();
  botBuy(log);
}
window.__ljusco = {
  get S() { return S; }, CONFIG, TUT, update, fmt, prestigeGain, canPrestige, doPrestige, weekEnd, triggerRandomEvent, triggerChoiceEvent, save, exportSave, importSave,
  startDay, finishReport, nextDay, autoFill, buyStock, splitSale, starsHTML, xpNeed, migrateV1, loadFrom, tutAdvance,
  forcePitch: () => { forcePitch = true; },
  skipTutorial: () => { S.tut.done.basic = true; S.tut.cur = null; TUT.seq = null; tutHide(); UI.closeModal(); },
  // Simulerar n dagar med en enkel bot (ingen UI). Returnerar logg och siffror.
  simDays(n, opts = {}) {
    const was = SIM; SIM = true; const log = [], d0 = S.day, t0 = S.time; let prestigeDay = null;
    const mark = name => log.push([S.day - d0 + 1, name]);
    for (let d = 0; d < n; d++) {
      if (S.phase === 'morning') { botMorning(mark); if (!startDay()) { autoFill(); startDay(); } }
      let acc = 0, guard = 0;
      while ((S.phase === 'day' || S.phase === 'closing') && guard++ < 10000) { update(0.1); acc += 0.1; if (acc >= 1) { acc = 0; if (S.phase === 'day') botDayTick(mark); } }
      if (S.phase === 'report') { finishReport(); if (S.phase === 'report') nextDay(); }
      if (prestigeDay === null && canPrestige()) { prestigeDay = S.day - d0; mark('PRESTIGE READY'); if (opts.stopAtPrestige) break; }
      if (opts.stopAtComplete && S.completed) { mark('COMPLETE'); break; }
    }
    SIM = was;
    return { log, days: S.day - d0, simTime: Math.round(S.time - t0), cash: S.cash, earned: S.cityEarned, income: S.incomeRate, levels: S.areas.map(a => a.unlocked ? a.level : 0), car: [S.car.tier, S.car.capLvl, S.car.speedLvl], kassa: S.kassa.lvl, storage: [S.storageLvl, storageCap()], bag: bagSize(), product: S.product, sellers: S.sellers.length, avgPct: +(sum(S.sellers.map(s => s.pct)) / S.sellers.length).toFixed(3), avgLvl: +(sum(S.sellers.map(s => s.lvl)) / S.sellers.length).toFixed(1), rykteGain: prestigeGain(), prestigeDay };
  },
};

/* =========================================================================
   START
   ========================================================================= */
function start() {
  if (!loadSaved()) newGame();
  if (S.tut.cur && S.tut.cur.key !== 'basic') S.tut.cur = null;
  UI.init();
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); lastFrame = 0; });
  window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => UI.buildScene(), 200); });
  requestAnimationFrame(frame);
}
start();
