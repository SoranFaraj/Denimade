    h += `<div class="sec"><h3>Fordon</h3><div class="ladder">${CONFIG.car.ladder.map((t, i) => {
      const cur = i === c.tier, owned = i < c.tier, next = i === c.tier + 1;
      return `<div class="lrow ${cur ? 'cur' : owned ? 'owned' : ''}" data-tip="tier:${i}"><div class="ic" style="overflow:hidden"><div style="transform:rotate(-90deg) scale(.42)">${carSVG(i)}</div></div><div class="tx"><b>${t.name}</b><small>${t.seats} platser${cur ? ' · kör nu' : ''}</small></div>
        ${next ? `<button class="buy ${S.cash >= t.cost ? 'can' : ''}" data-act="carTier">Köp · ${kr(t.cost)}</button>` : owned || cur ? '<span class="muted">✓</span>' : `<span class="muted">${kr(t.cost)}</span>`}</div>`;
    }).join('')}</div></div>`;
    const bc = bulkInfo(CONFIG.car.capCostBase, c.capLvl), bs = bulkInfo(CONFIG.car.speedCostBase, c.speedLvl);
    h += `<div class="sec"><h3>Uppgraderingar</h3>
      <div class="upRow"><div class="tx">Kapacitet nivå ${c.capLvl}<small>${kr(carCap())} per tur</small></div><button class="buy ${S.cash >= bc.cost ? 'can' : ''}" data-act="carUp" data-arg="cap" data-tip="carCap">${bc.n > 1 ? '×' + bc.n + ' · ' : ''}${kr(bc.cost)}</button></div>
      <div class="upRow"><div class="tx">Hastighet nivå ${c.speedLvl}<small>${fmt1(carSpeed())} områden/s</small></div><button class="buy ${S.cash >= bs.cost ? 'can' : ''}" data-act="carUp" data-arg="speed" data-tip="carSpeed">${bs.n > 1 ? '×' + bs.n + ' · ' : ''}${kr(bs.cost)}</button></div></div>`;
    h += abilityUpgradesHTML('arvin');
    return h;
  },
  coach() {
    const C = S.coach, cfg = CONFIG.coach;
    if (!S.areas[1].unlocked) return `<div class="sec"><h3>Säljcoach 🔒</h3><p>Coachen kan anställas när ni har låst upp ${esc(areaName(1))}.</p></div>`;
    if (!C.hired) return `<div class="sec"><h3>Säljcoach</h3><p>Coachen tränar hela B-laget, även de på bänken. Deras säljprocent ökar lite varje spelvecka upp till ett tak (35 % från början).</p>
      <p>Kostnad: <b>5 % av all försäljning</b> + anställning ${kr(cfg.hireCost)}.</p><div class="btns"><button class="buy ${S.cash >= cfg.hireCost ? 'can' : ''}" data-act="hireCoach">Anställ coach · ${kr(cfg.hireCost)}</button></div></div>`;
    const capMax = C.capLvl >= cfg.capMaxLevel, trMax = C.trainLvl >= cfg.trainMaxLevel;
    let h = `<div class="sec"><h3>Säljcoach <span class="badge seat">Anställd</span></h3><p>Tränar B-laget med <b>+${pctStr(coachTrain(), 1)}</b> per vecka upp till <b>${pctStr(coachCap())}</b>. Kostar 5 % av försäljningspriset.</p>
      <div class="upRow"><div class="tx">Höj taket<small>${capMax ? 'Max (60 %)' : pctStr(coachCap()) + ' → ' + pctStr(coachCap() + cfg.capStep)}</small></div><button class="buy ${!capMax && S.cash >= coachCapCost() ? 'can' : ''}" data-act="coachUp" data-arg="cap" ${capMax ? 'disabled' : ''}>${capMax ? 'Max' : kr(coachCapCost())}</button></div>
      <div class="upRow"><div class="tx">Snabbare träning<small>${trMax ? 'Max' : '+' + pctStr(coachTrain(), 1) + ' → +' + pctStr(coachTrain() + cfg.trainStep, 1) + ' per vecka'}</small></div><button class="buy ${!trMax && S.cash >= coachTrainCost() ? 'can' : ''}" data-act="coachUp" data-arg="train" ${trMax ? 'disabled' : ''}>${trMax ? 'Max' : kr(coachTrainCost())}</button></div></div>`;
    const B = S.sellers.filter(s => s.team === 'B');
    h += `<div class="sec"><h3>B-laget (${B.length})</h3>${B.map(s => `<div class="sellerCard"><div class="l1"><b>${esc(s.name)}</b>${starsHTML(s.pct)}<span class="muted">${pctStr(s.pct, 1)} / ${pctStr(coachCap())}</span></div><div class="prog"><i style="width:${Math.min(100, 100 * s.pct / coachCap())}%"></i></div></div>`).join('') || '<p>Ingen i B-laget just nu.</p>'}</div>`;
    return h;
  },
  rapport() {
    const row = (r, w) => `<table class="rep"><tr><th>${w}</th><th></th></tr>
      <tr><td>Sålda klasar</td><td>${fmt(r.clusters)} st</td></tr>
      <tr><td>Total försäljning</td><td>${kr(r.gross)}</td></tr>
      <tr><td>Utbetald provision</td><td>−${kr(r.commission)}</td></tr>
      <tr><td>Maxis andel</td><td>−${kr(r.maxiOwn + r.maxiOther)}</td></tr>
      <tr class="sub"><td>varav hans egna säljare</td><td>${kr(r.maxiOwn)}</td></tr>
      <tr class="sub"><td>varav övriga säljare</td><td>${kr(r.maxiOther)}</td></tr>
      <tr><td>Coachens andel</td><td>−${kr(r.coach)}</td></tr>
      <tr><td>Värvningsbonusar</td><td>−${kr(r.recruit)}</td></tr>
      <tr class="tot"><td>Vinst (till säljpåsarna)</td><td>${kr(r.profit)}</td></tr>
      ${r.rykteBonus > 0 ? `<tr><td>Rykte-bonus i kassan</td><td>+${kr(r.rykteBonus)}</td></tr>` : ''}</table>`;
    let h = `<div class="sec"><h3>Veckorapport <span class="muted">vecka ${S.week.n} pågår</span></h3>${row(S.report.cur, 'Denna vecka')}</div>`;
    if (S.report.last) h += `<div class="sec">${row(S.report.last, 'Förra veckan (v. ' + S.report.last.week + ')')}</div>`;
    const ex = splitSale(200, { team: 'A', maxi: false, recruitedBy: null });
    h += `<div class="sec"><h3>Så räknas en försäljning</h3><p>Exempel: vit klase 200 kr i ${esc(areaName(0))}, A-lagare (ej Maxis säljare): provision ${krExact(ex.commission)}, Maxi ${krExact(ex.maxiOwn + ex.maxiOther)}${S.coach.hired ? ', coach ' + krExact(ex.coach) : ''}, vinst <b>${krExact(ex.profit)}</b>.</p></div>`;
    // Målet
    const gp = goalParts();
    h += `<div class="sec"><h3>Mål ${S.completed ? '<span class="badge seat">Klart!</span>' : ''}</h3>
      ${gp.map(([t, ok]) => `<p>${ok ? '✅' : '⬜'} ${esc(t)}</p>`).join('')}
      <p class="muted">${S.completed ? 'Avklarat på ' + playTimeStr(S.completedAt) + '.' : `Speltid hittills: ${playTimeStr(S.time)} (beräknat ca 5 h totalt). Städer: ${CONFIG.cities.map(c => c.name).join(' → ')}.`}</p></div>`;
    // Prestige
    const gain = prestigeGain(), ok = canPrestige(), nc = CONFIG.cities[nextCityIdx()];
    h += `<div class="sec"><h3>Ny stad 🏙️</h3><p>Intjänat i ${esc(city().name)}: <b>${kr(S.cityEarned)}</b> (krävs ${kr(CONFIG.prestige.minEarned)})</p>
      <div class="prog"><i style="width:${Math.min(100, 100 * S.cityEarned / CONFIG.prestige.minEarned)}%"></i></div>
      <p>Expandera till <b>${esc(nc.name)}</b> och få <b>★ ${gain} Rykte</b> (+${Math.round(gain * CONFIG.prestige.perRykte * 100)} % inkomst för alltid).</p>
      <div class="btns"><button class="${ok ? 'orange' : ''}" data-act="prestige" ${ok ? '' : 'disabled'}>${isLastCity() ? 'Starta om i ' : 'Expandera till '}${esc(nc.name)}</button></div></div>`;
    const A = S.report.all;
    h += `<div class="sec"><h3>Statistik</h3><table class="rep">
      <tr><td>Totalt intjänat</td><td>${kr(S.totalEarned)}</td></tr><tr><td>Sålda klasar totalt</td><td>${fmt(A.clusters)}</td></tr>
      <tr><td>Total försäljning</td><td>${kr(A.gross)}</td></tr><tr><td>Total provision</td><td>${kr(A.commission)}</td></tr>
      <tr><td>Maxi totalt</td><td>${kr(A.maxiOwn + A.maxiOther)}</td></tr><tr><td>Coach totalt</td><td>${kr(A.coach)}</td></tr>
      <tr><td>Anställda / sparkade</td><td>${S.stats.hired} / ${S.stats.fired}</td></tr><tr><td>Slumphändelser</td><td>${S.stats.events}</td></tr>
      <tr><td>Städer expanderade</td><td>${S.stats.prestiges}</td></tr><tr><td>Speltid</td><td>${Math.floor(S.time / 3600)} h ${Math.floor(S.time % 3600 / 60)} min</td></tr></table></div>`;
    return h;
  },
};
function abilityUpgradesHTML(who) {
  let h = `<div class="sec"><h3>${who === 'soran' ? 'Sorans' : 'Arvins'} förmågor</h3>`;
  for (const k in CONFIG.abilities) {
    const c = CONFIG.abilities[k]; if (c.who !== who) continue;
    const st = S.abilities[k], max = st.lvl >= c.maxLevel, cost = abilityUpCost(k);
    const nx = max ? 'Max' : `${c.duration ? `Tid ${abilityDuration(k)} s → ${abilityDuration(k) + c.durStep} s · ` : ''}Cooldown ${timeStr(abilityCooldown(k))} → ${timeStr(c.cooldown * (1 - c.cdStep * (st.lvl + 1)))}`;
    h += `<div class="upRow"><div class="tx">${c.name} nivå ${st.lvl}<small>${nx}</small></div><button class="buy ${!max && S.cash >= cost ? 'can' : ''}" data-act="abUp" data-arg="${k}" ${max ? 'disabled' : ''}>${max ? 'Max' : kr(cost)}</button></div>`;
  }
  return h + '</div>';
}

/* ---------- Knapptryck ---------- */
const ACT = {
  tab: k => UI.setTab(k),
  buyMode: m => { S.buyMode = m === 'max' ? 'max' : +m; },
  areaUp: i => upgradeArea(+i),
  unlock: i => unlockArea(+i),
  carUp: k => upgradeCar(k),
  kassaUp: () => upgradeKassa(),
  product: () => buyProduct(),
  carTier: () => buyCarTier(),
  hireCoach: () => { if (hireCoach()) UI.toast('Coachen är anställd!', 'B-laget tränas nu varje vecka.', 'good'); },
  coachUp: k => upgradeCoach(k),
  maxiUp: () => upgradeMaxi(),
  abUp: k => upgradeAbility(k),
  hire: i => { if (!hire(+i)) UI.toast('För lite pengar', 'Sälj lite mer först!', 'bad'); },
  autoDist: () => { autoDistribute(); UI.toast('Fördelat!', 'De bästa säljarna står nu i områdena med högst köpkraft.', 'good'); },
  resetPins: () => { S.sellers.forEach(s => s.pin = 0); seatsDirty = true; },
  seat: id => {
    const s = S.sellers.find(x => x.id === +id); if (!s) return;
    if (s.seated) s.pin = -1;
    else {
      // Ta med: om bilen är full, bänka den sämst placerade som inte är fastnålad
      s.pin = 1; assignSeats();
      if (!s.seated) { const counts = S.areas.map((a, i) => areaWorkers(i).length); if (bestAreaWithRoom(counts) < 0 && !S.sellers.some(x => x.seated && x.area === s.area)) UI.toast('Inget ledigt område', 'Alla områden är fulla. Flytta någon eller uppgradera ett område.', 'bad'); }
    }
    seatsDirty = true;
  },
  move: id => {
    const s = S.sellers.find(x => x.id === +id); if (!s) return;
    const btns = S.areas.map((a, i) => i).filter(i => S.areas[i].unlocked).map(i => {
      const w = areaWorkers(i).length, full = s.seated && s.area !== i && w >= areaSeats(i);
      return `<button class="${i === s.area ? 'orange' : ''}" data-mv="${i}" ${full ? 'disabled' : ''} style="margin:3px">${esc(areaName(i))} (${w}/${areaSeats(i)}) ×${fmt(buyPower(i))}</button>`;
    }).join('');
    UI.modal(`Flytta ${esc(s.name)}`, `<p>Välj område. Siffrorna visar säljare i området / platser.</p><div>${btns}</div>`, [{ label: 'Stäng', cls: '' }], {
      onOpen: L => L.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { moveSeller(s.id, +b.dataset.mv); UI.nextModal(); }) });
  },
  fire: id => {
    const s = S.sellers.find(x => x.id === +id); if (!s) return;
    UI.confirm(`Sparka ${esc(s.name)}?`, `<p>${esc(s.name)} har ${pctStr(s.pct)} i säljprocent och har sålt ${fmt(s.total.sold)} klasar totalt.</p><p><i>${esc(s.name)}: ${pick(CONFIG.fireQuips)}</i></p>`, () => { fire(s.id); UI.toast(`${esc(s.name)} har lämnat LjusCo`, 'Väskan är tillbakalämnad.', ''); }, 'Sparka');
  },
  endMaxi: () => UI.confirm('Avsluta samarbetet med Maxi?', '<p>Maxis andel och peppbonus försvinner, han slutar ta in kandidater och hans säljare blir vanliga säljare. <b>Han kan inte anställas tillbaka.</b></p>',
    () => { endMaxi(); UI.toast('Maxi har gått vidare', '"Det var fint så länge det varade, grabbar!"', ''); }, 'Avsluta'),
  ability: k => {
    if (!abilityReady(k)) return;
    if (k !== 'gold') { useAbility(k); return; }
    const btns = S.areas.map((a, i) => i).filter(i => S.areas[i].unlocked).map(i => `<button data-gd="${i}" style="margin:3px">${esc(areaName(i))} (${areaWorkers(i).length} säljare)</button>`).join('');
    UI.modal('Hittar guldgatan', '<p>Arvin har hittat en gata där alla verkar hemma. Vilket område?</p>' + btns, [{ label: 'Avbryt', cls: '' }], {
      onOpen: L => L.querySelectorAll('[data-gd]').forEach(b => b.onclick = () => { useAbility('gold', +b.dataset.gd); UI.nextModal(); }) });
  },
  mgrUp: who => UI.modal(who === 'soran' ? 'Sorans förmågor' : 'Arvins förmågor', `<div class="speech"><div class="bigPortrait">${portraitSVG(who)}</div><div id="abUpBox" style="flex:1">${abilityUpgradesHTML(who)}</div></div>`, [{ label: 'Stäng', cls: '' }], {
    width: 600, onOpen: L => L.querySelector('#abUpBox').addEventListener('click', e => { const b = e.target.closest('[data-act="abUp"]'); if (b) setTimeout(() => { L.querySelector('#abUpBox').innerHTML = abilityUpgradesHTML(who); }, 0); }) }),
  prestige: () => {
    if (!canPrestige()) return;
    const g = prestigeGain(), nc = CONFIG.cities[nextCityIdx()];
    UI.confirm(`Expandera till ${esc(nc.name)}?`, `<p>Du får <b>★ ${g} Rykte</b> (totalt ${S.rykte + g} = +${Math.round((S.rykte + g) * CONFIG.prestige.perRykte * 100)} % inkomst för alltid).</p>
      <p><b>Nollställs:</b> pengar, områden, produkter, bil, coach, alla uppgraderingar och förmågenivåer (även Maxis peppbonus).</p>
      <p><b>Följer med:</b> alla säljare med sin tränade säljprocent${S.maxi.active ? ', Maxi och hans säljare' : ''}.</p>`,
      () => { const gg = doPrestige(); UI.buildScene(); UI.toast(`Välkommen till ${esc(city().name)}!`, `+★ ${gg} Rykte. Nu börjar vi om i ${esc(areaName(0))}.`, 'good'); save(); }, 'Expandera!', 'orange');
  },
  settings: () => {
    UI.modal('Inställningar', `<p><b>Exportera sparfil</b> – kopiera koden och spara den någonstans.</p><textarea id="expBox" readonly></textarea>
      <p><b>Importera</b> – klistra in en sparkod.</p><textarea id="impBox"></textarea>
      <p class="muted">Spelet sparas automatiskt var 10:e sekund. När spelet är stängt händer ingenting.</p>`,
      [{ label: 'Nollställ spelet', cls: 'red', fn: () => { UI.confirm('Nollställa allt?', '<p>All framgång försvinner för alltid. Säker?</p>', () => { try { localStorage.removeItem(CONFIG.saveKey); } catch (e) {} newGame(); S.tutorialDone = true; UI.buildScene(); UI.setTab('personal'); UI.toast('Nytt spel', 'Lycka till!', 'good'); }, 'Nollställ'); } },
       { label: 'Importera', cls: 'orange', fn: L => { const v = L.querySelector('#impBox').value; if (!v.trim()) return true; try { importSave(v); UI.buildScene(); UI.setTab(S.tab || 'personal'); UI.toast('Importerat!', 'Sparfilen är laddad.', 'good'); save(); } catch (e) { UI.toast('Kunde inte importera', 'Koden verkar vara fel.', 'bad'); return true; } } },
       { label: 'Stäng', cls: '' }],
      { onOpen: L => { const b = L.querySelector('#expBox'); b.value = exportSave(); b.onclick = () => b.select(); } });
  },
};

/* =========================================================================
   SPELLOOPEN (requestAnimationFrame + delta-tid)
   ========================================================================= */
let lastFrame = 0, panelTimer = 0, saveTimer = 0, spriteTimer = 0;
function frame(now) {
  let dt = lastFrame ? (now - lastFrame) / 1000 : 0; lastFrame = now;
  dt = Math.min(dt, 0.25);                   // stängd/dold flik = ingen offline-tid
  try {
    if (!paused) update(dt);
    spriteTimer += dt; if (spriteTimer > 0.2) { spriteTimer = 0; VIS.syncSprites(); }
    VIS.frame(paused ? 0 : dt);
    UI.updateScene(); UI.updateTop(); UI.updateManagers();
    panelTimer += dt; if (panelTimer > 0.25) { panelTimer = 0; UI.refreshPanel(); }
    saveTimer += dt; if (saveTimer > CONFIG.autosaveSeconds) { saveTimer = 0; save(); }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

/* =========================================================================
   DEBUG/BALANS (används bara för test): window.__ljusco
   ========================================================================= */
function botTick(log) {
  for (const k of ['pep', 'gas', 'recruit']) if (abilityReady(k)) useAbility(k);
  if (abilityReady('gold')) useAbility('gold', unlockedCount() - 1);
  if (effect('punka')) fixFlat();
  // Anställ om det finns lediga bilplatser
  while (S.sellers.length < carSeats() + 2 && S.candidates.length) {
    const i = S.candidates.map((c, i) => i).filter(i => S.candidates[i].cost <= S.cash * 0.5).sort((a, b) => S.candidates[b].pct - S.candidates[a].pct)[0];
    if (i === undefined) break; hire(i);
  }
  for (let g = 0; g < 400; g++) {
    const opts = [];
    const nu = S.areas.findIndex(a => !a.unlocked);
    if (nu > 0) opts.push({ prio: 1, cost: CONFIG.area.unlockCost[nu], fn: () => unlockArea(nu), name: 'unlock ' + nu });
    if (S.product + 1 < CONFIG.products.length) opts.push({ prio: 1, cost: CONFIG.products[S.product + 1].cost, fn: buyProduct, name: 'product ' + (S.product + 1) });
    if (S.car.tier + 1 < CONFIG.car.ladder.length) opts.push({ prio: 1, cost: CONFIG.car.ladder[S.car.tier + 1].cost, fn: buyCarTier, name: 'car ' + (S.car.tier + 1) });
    if (S.areas[1].unlocked && !S.coach.hired) opts.push({ prio: 1, cost: CONFIG.coach.hireCost, fn: hireCoach, name: 'coach' });
    S.areas.forEach((a, i) => { if (a.unlocked) opts.push({ cost: levelCost(CONFIG.area.upgradeBase[i], a.level) * (1 + 0.3 * (S.areas.length - i - 1) * 0), fn: () => { const m = S.buyMode; S.buyMode = 1; upgradeArea(i); S.buyMode = m; } }); });
    opts.push({ cost: levelCost(CONFIG.car.capCostBase, S.car.capLvl), fn: () => { const m = S.buyMode; S.buyMode = 1; upgradeCar('cap'); S.buyMode = m; } });
    opts.push({ cost: levelCost(CONFIG.car.speedCostBase, S.car.speedLvl), fn: () => { const m = S.buyMode; S.buyMode = 1; upgradeCar('speed'); S.buyMode = m; } });
    opts.push({ cost: levelCost(CONFIG.kassa.costBase, S.kassa.lvl), fn: () => { const m = S.buyMode; S.buyMode = 1; upgradeKassa(); S.buyMode = m; } });
    if (S.maxi.pepLvl < CONFIG.maxi.pepLevels.length - 1) opts.push({ cost: maxiPepCost(), fn: upgradeMaxi });
    for (const k in CONFIG.abilities) if (S.abilities[k].lvl < CONFIG.abilities[k].maxLevel) opts.push({ cost: abilityUpCost(k), fn: () => upgradeAbility(k) });
    if (S.coach.hired) { if (S.coach.capLvl < 5) opts.push({ cost: coachCapCost(), fn: () => upgradeCoach('cap') }); if (S.coach.trainLvl < 5) opts.push({ cost: coachTrainCost(), fn: () => upgradeCoach('train') }); }
    const prio = opts.filter(o => o.prio).sort((a, b) => a.cost - b.cost);
    const big = prio.find(o => o.cost <= S.cash);
    if (big) { big.fn(); if (log) log(big.name); continue; }
    const small = opts.filter(o => !o.prio && o.cost <= S.cash).sort((a, b) => a.cost - b.cost)[0];
    if (!small) break;
    const goal = prio[0];
    if (goal && goal.cost <= S.cash + S.incomeRate * 150 && small.cost > S.cash - goal.cost) break; // spara till målet
    small.fn();
  }
}
window.__ljusco = {
  get S() { return S; }, CONFIG, update, fmt, prestigeGain, canPrestige, doPrestige, weekEnd, triggerRandomEvent, save, exportSave, importSave,
  sim(seconds, opts = {}) {
    const wasSim = SIM; SIM = true; const log = []; const t0 = S.time;
    const mark = name => log.push([Math.round(S.time - t0), name]);
    let acc = 0, prestigeAt = null;
    for (let t = 0; t < seconds; t += 0.1) {
      update(0.1); acc += 0.1;
      if (opts.bot && acc >= 1) { acc = 0; botTick(mark); }
      if (prestigeAt === null && canPrestige()) { prestigeAt = Math.round(S.time - t0); mark('PRESTIGE READY'); if (opts.stopAtPrestige) break; }
    }
    SIM = wasSim;
    return { log, cash: S.cash, earned: S.cityEarned, income: S.incomeRate, levels: S.areas.map(a => a.unlocked ? a.level : 0), car: [S.car.tier, S.car.capLvl, S.car.speedLvl], kassa: S.kassa.lvl, product: S.product, sellers: S.sellers.length, rykteGain: prestigeGain() };
  },
};

/* =========================================================================
   START
   ========================================================================= */
function start() {
  if (!loadSaved()) newGame();
  assignSeats();
  UI.init();
  if (!S.tutorialDone) UI.tutorial();
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); lastFrame = 0; });
  window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => UI.buildScene(), 200); });
  requestAnimationFrame(frame);
}
start();
</script>
